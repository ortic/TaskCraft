apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskcraft
  labels: { app.kubernetes.io/name: taskcraft }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: taskcraft }
  template:
    metadata:
      labels: { app.kubernetes.io/name: taskcraft }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: taskcraft }
      containers:
        - name: taskcraft
          image: taskcraft
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8788 }
          envFrom:
            - configMapRef: { name: taskcraft }
            - secretRef: { name: taskcraft }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 2
            failureThreshold: 60   # migrations run on startup (serialized by an advisory lock)
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 5
          lifecycle:
            # keep serving while the endpoint leaves the load balancers; SIGTERM then reports
            # not-ready and lets open requests finish
            preStop:
              sleep: { seconds: 5 }
          volumeMounts:
            - { name: data, mountPath: /data }   # scratch only (uploads in progress); nothing persistent
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 5Gi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
