# Copy to secret.yaml (it is git-ignored; never commit real values) or create it with your
# secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: taskcraft
type: Opaque
stringData:
  TASKCRAFT_DATABASE_URL: "postgres://taskcraft:CHANGE-ME@postgres.example.internal:5432/taskcraft?sslmode=require"
  TASKCRAFT_S3_ACCESS_KEY_ID: "CHANGE-ME"
  TASKCRAFT_S3_SECRET_ACCESS_KEY: "CHANGE-ME"
  TASKCRAFT_SMTP_URL: "smtps://tasks%40example.com:CHANGE-ME@mail.example.com"
  TASKCRAFT_METRICS_TOKEN: "CHANGE-ME"   # Prometheus: bearer token for /api/metrics
  # TASKCRAFT_WIKICRAFT_TOKEN: "wct_..."
  # TASKCRAFT_OIDC_CLIENT_SECRET: "CHANGE-ME"
