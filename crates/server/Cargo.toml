[package]
name = "taskcraft"
description = "TaskCraft — self-hosted issue and project management"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
# e-mail in (crate::mail_in): IMAP polling
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
# passkeys (WebAuthn): CBOR and signature checks
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
comrak = { version = "0.59.0", default-features = false }
csv = "1.4.0"
# backups: .tar.gz archives
flate2 = "1.1.11"
futures = "0.3.34"
hex = "0.4.3"
# e-mail in: parsing received messages
mail-parser = "0.11.9"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
hmac = "0.13.0"
# single sign-on (crate::sso): LDAP / Active Directory, OpenID Connect, SAML (feature `saml`)
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
mime_guess = "2.0.5"
object_store = { version = "0.14.2", features = ["aws"] }
openidconnect = "4.1.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
ring = "0.17.14"
rmcp = { version = "3.9.0", features = ["server", "transport-streamable-http-server", "macros"] }
rust-embed = { version = "8", features = ["mime-guess"] }
samael = { version = "0.0.22", optional = true }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tar = "0.4.44"
taskcraft-tql = { version = "0.1.0", path = "../tql" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip", "limit", "set-header", "timeout", "request-id", "util", "catch-panic", "propagate-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
webpki-roots = "1.0.12"
uuid = { version = "1.29.2", features = ["v7", "v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "multipart", "query", "form"] }
# signs the ID tokens of the mock OpenID provider in tests/sso.rs
rsa = { version = "0.9.10", features = ["getrandom"] }
tempfile = "3.27.0"

[features]
default = []
# SAML 2.0 single sign-on (needs the libxml2 and xmlsec1 development packages at build time)
saml = ["dep:samael"]

[lints]
workspace = true
