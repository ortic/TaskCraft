      description: Workspace owners and admins, in the browser (API tokens are refused).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  imports:
                    type: array
                    items:
                      $ref: '#/components/schemas/BackupImport'
                  maxUploadMb:
                    type: integer
                    description: the largest upload (TASKCRAFT_MAX_UPLOAD_MB)
                required:
                - imports
                - maxUploadMb
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - session: []
    post:
      tags:
      - Backup import
      summary: Upload an XML site backup or a TaskCraft project export (.zip) and check it in the background
      operationId: uploadBackup
      description: The .zip itself is the request body, up to TASKCRAFT_MAX_UPLOAD_MB (413). Answers at once with the job
        in `checking`; poll it until it's `checked` (with its summary) or `failed`. A .zip with taskcraft-project.json is
        a project export (the job's source becomes `taskcraft`). One backup at a time is checked or imported (409). The file
        is kept for a day at most and deleted once it's imported. Workspace owners and admins, in the browser (API tokens
        are refused).
      parameters:
      - name: name
        in: query
        required: false
        description: the file's name (default backup.zip)
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
              description: the backup .zip as downloaded
      responses:
        '202':
          description: Uploaded; being checked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupImport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
      security:
      - session: []
  /admin/backup-imports/{id}:
    get:
      tags:
      - Backup import
      summary: 'An upload: its check, progress and report'
      operationId: getBackupImport
      description: Workspace owners and admins, in the browser (API tokens are refused).
      parameters:
      - name: id
        in: path
        required: true
        description: import id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupImport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - session: []
    delete:
      tags:
      - Backup import
      summary: Discard an upload and its file
      operationId: discardBackupImport
      description: Not while it's being checked or imported (409). Workspace owners and admins, in the browser (API tokens
        are refused).
      parameters:
      - name: id
        in: path
        required: true
        description: import id
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - session: []
  /admin/backup-imports/{id}/run:
    post:
      tags:
      - Backup import
      summary: Start the import (or a dry run) with the choices made
      operationId: runBackupImport
      description: 'Runs in the background as one transaction: it lands completely or not at all; imports tell nobody (no
        e-mails, notifications, webhooks or automation), and importing the same backup again skips what''s already there.
        Allowed when the upload is `checked`, `failed` or `done` (else 409) and its file is still there. Poll the job for
        progress and the report. Workspace owners and admins, in the browser (API tokens are refused).'
      parameters:
      - name: id
        in: path
        required: true
        description: import id
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupImportRun'
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupImport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - session: []
  /admin/backup-imports/connect:
    post:
      tags:
      - Backup import
      summary: Read projects from another tracker's API and check them in the background
      operationId: connectImportSource
      description: Answers at once with the job in `checking` while the projects are read (issues, comments, history, people;
        attachments are downloaded later, while importing). Requests go to the given server only; private and loopback addresses
        are refused unless TASKCRAFT_IMPORT_ALLOW_PRIVATE allows them; rate limits are waited out (progress phase `waiting`).
        What was read is kept for a day at most; the token is never stored. One import at a time (409). Workspace owners and
        admins, in the browser (API tokens are refused).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportConnection'
      responses:
        '202':
          description: Connected; being read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupImport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - session: []
  /admin/backup-imports/browse:
    post:
      tags:
      - Backup import
      summary: Projects of another tracker's API to choose from
      operationId: browseImportSource
      description: The token's own repositories or projects, or those of an owner (user, organization, group); at most 300.
        400 with the source's answer when it refuses. Workspace owners and admins, in the browser (API tokens are refused).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  enum:
                  - github
                  - gitlab
                  - redmine
                  description: the tracker whose API is read
                baseUrl:
                  type: string
                token:
                  type: string
                owner:
                  type: string
                  description: a user, organization or group
              required:
              - source
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        name:
                          type: string
                        description:
                          type:
                          - string
                          - 'null'
                        issues:
                          type: integer
                          description: open issues, when the source says
                        private:
                          type: boolean
                        parent:
                          type:
                          - string
                          - 'null'
                      required:
                      - key
                      - name
                required:
                - projects
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - session: []
  /health:
    get:
      tags:
      - Operations
      summary: 'Liveness: answers while the process runs'
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
      security:
      - {}
  /ready:
    get:
      tags:
      - Operations
      summary: 'Readiness: whether this replica can serve'
      operationId: getReadiness
      description: 503 while it drains connections before a stop, or without its database.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - unavailable
                  database:
                    type: boolean
                    description: the database answers
                required:
                - status
                - database
      security:
      - {}
  /metrics:
    get:
      tags:
      - Operations
      summary: Prometheus metrics of this replica
      operationId: getMetrics
      description: Requests by method, route pattern and status class with durations, database pool, e-mail and webhook outboxes,
        e-mail in, live connections and counts. Off (404) unless TASKCRAFT_METRICS_TOKEN is set; scrape every replica.
      responses:
        '200':
          description: Prometheus text format
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
        '401':
          description: Wrong or missing token
        '404':
          description: Metrics are off (no TASKCRAFT_METRICS_TOKEN)
      security:
      - metricsToken: []
  /events:
    get:
      tags:
      - Operations
      summary: Live updates (Server-Sent Events)
      operationId: streamEvents
      description: 'A `text/event-stream` of the changes in projects the caller can see: first `hello`, then a `change` event
        (data: LiveEvent) per change, `resync` (data `{}`) when the stream fell behind and everything shown should be refetched;
        keep-alive comments every 20 seconds. Works across replicas.'
      responses:
        '200':
          description: the event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: 'event: hello | change | resync, data: LiveEvent JSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /openapi.yaml:
    get:
      tags:
      - Operations
      summary: This document (YAML)
      operationId: getOpenApiYaml
      responses:
        '200':
          description: OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
      security:
      - {}
  /openapi.json:
    get:
      tags:
      - Operations
      summary: This document (JSON)
      operationId: getOpenApiJson
      responses:
        '200':
          description: OpenAPI 3.1 document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      security:
      - {}
webhooks:
  event:
    post:
      tags:
      - Webhooks
      summary: A webhook delivery (TaskCraft calls your endpoint)
      operationId: webhookDelivery
      description: Sent to every active webhook whose events (and project) match, from a Postgres outbox any replica delivers.
        Check `X-TaskCraft-Signature` (HMAC-SHA256 of the raw body with the webhook's secret, hex, prefixed `sha256=`) in
        constant time before trusting the body. Redirects aren't followed; private and loopback addresses are refused unless
        TASKCRAFT_WEBHOOK_ALLOW_PRIVATE is set.
      security: []
      parameters:
      - name: X-TaskCraft-Event
        in: header
        required: true
        description: the event, as in the body's `event`
        schema:
          type: string
      - name: X-TaskCraft-Signature
        in: header
        required: true
        description: '`sha256=<hex>`: HMAC-SHA256 of the raw body with the webhook''s secret'
        schema:
          type: string
      - name: User-Agent
        in: header
        required: false
        description: '`TaskCraft-Webhooks/<version>`'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        2XX:
          description: Delivered
        default:
          description: 'Anything else, or no answer within 10 seconds, is tried again up to 7 times with growing pauses: 30
            seconds, 2 minutes, 8 minutes, and four times longer each time'
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      bearerFormat: tct_…
      description: 'A personal API token (`Authorization: Bearer tct_…`, created under Profile & settings → API tokens). Read-only
        tokens may only read (GET, plus POST /query/validate); anything else answers 403.'
    session:
      type: apiKey
      in: cookie
      name: tc_session
      description: 'The web app''s session cookie. Requests that change data (anything but GET, HEAD, OPTIONS) must also send
        the header `x-taskcraft: 1` (CSRF protection), else 400.'
    portalSession:
      type: apiKey
      in: cookie
      name: tc_portal
      description: 'The service desk portal''s own session (7 days), started from an e-mailed sign-in link; sent only to /api/portal
        and never a TaskCraft sign-in. Writes need `x-taskcraft: 1`.'
    metricsToken:
      type: http
      scheme: bearer
      description: The value of TASKCRAFT_METRICS_TOKEN (the endpoint answers 404 without one configured).
    mailInToken:
      type: http
      scheme: bearer
      description: The value of TASKCRAFT_MAIL_IN_TOKEN (the endpoint answers 404 without one configured).
    mailInHeader:
      type: apiKey
      in: header
      name: X-TaskCraft-Token
      description: TASKCRAFT_MAIL_IN_TOKEN in a header of its own.
    mailInQuery:
      type: apiKey
      in: query
      name: token
      description: TASKCRAFT_MAIL_IN_TOKEN in the address, for mail services that can't set headers.
  responses:
    BadRequest:
      description: Invalid input (the message says what), or a browser-session write without the `x-taskcraft` header. A body
        that isn't JSON at all is refused as plain text
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not signed in, or an unknown / expired API token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Not allowed: missing role or project permission, a read-only token on a write, an API token where the
        browser is required, or two-factor setup required first'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with the current state (e.g. already exists)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: The request body is too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooMany:
      description: A rate limit was reached; the message says when to try again
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Not available right now; try again later
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          enum:
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - conflict
          - too_large
          - too_many_requests
          - unavailable
          - internal
          description: machine-readable error code
        message:
          type: string
          description: what went wrong, for people
      required:
      - error
      - message
      description: Every error answer has this shape.
    PmNode:
      type: object
      description: 'Rich text as ProseMirror / Tiptap JSON: a node with `type`, optional `attrs`, `content` (child nodes),
        `text` and `marks`. A document is `{"type": "doc", "content": [...]}` (at most 50,000 nodes, 40 levels deep). Where
        noted, Markdown or plain text is accepted instead.'
      properties:
        type:
          type: string
        attrs:
          type: object
          additionalProperties: true
        content:
          type: array
          items:
            $ref: '#/components/schemas/PmNode'
        text:
          type: string
        marks:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
      - type
      additionalProperties: true
    Named:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
      description: A reference to a person, version, component, … by id with its name.
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        email:
          type:
          - string
          - 'null'
        name:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - member
          - guest
          description: workspace role
        status:
          type: string
          enum:
          - active
          - invited
          - deactivated
          description: account status
        photo:
          type:
          - string
          - 'null'
          description: the profile photo's address (in /me)
      required:
      - id
      - workspaceId
      - name
      - role
      - status
      description: A person with an account.
    Priority:
      type: string
      enum:
      - none
      - low
      - medium
      - high
      - urgent
      description: issue priority
    StatusCategory:
      type: string
      enum:
      - todo
      - in_progress
      - done
      description: status category
    TypeRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        level:
          type: integer
          description: 0 = standard, 1 = epic (above), -1 = sub-task (below)
      required:
      - id
      - name
      - icon
      - color
      - level
    StatusRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: '#/components/schemas/StatusCategory'
        color:
          type:
          - string
          - 'null'
      required:
      - id
      - name
      - category
    ParentRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        title:
          type: string
        color:
          type:
          - string
          - 'null'
          description: the parent's type colour (epics)
      required:
      - id
      - key
      - title
    SprintRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
          enum:
          - future
          - active
          - closed
      required:
      - id
      - name
      - state
    IssueSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: project key and number, e.g. WEB-12
        number:
          type: integer
        projectId:
          type: string
          format: uuid
        projectKey:
          type: string
        projectName:
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/TypeRef'
        status:
          $ref: '#/components/schemas/StatusRef'
        priority:
          $ref: '#/components/schemas/Priority'
        assignee:
          anyOf:
          - $ref: '#/components/schemas/Named'
          - type: 'null'
        reporter:
          anyOf:
          - $ref: '#/components/schemas/Named'
          - type: 'null'
        parent:
          anyOf:
          - $ref: '#/components/schemas/ParentRef'
          - type: 'null'
          description: parent issue or epic
        sprint:
          anyOf:
          - $ref: '#/components/schemas/SprintRef'
          - type: 'null'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/Named'
          description: the releases it's fixed in, in release order
        affectedVersions:
          type: array
          items:
            $ref: '#/components/schemas/Named'
          description: the releases it was found in
        components:
          type: array
          items:
            $ref: '#/components/schemas/Named'
          description: by name
        storyPoints:
          type:
          - number
          - 'null'
        estimateMinutes:
          type:
          - integer
          - 'null'
          description: the original estimate
        remainingMinutes:
          type:
          - integer
          - 'null'
          description: 'what''s left: set by someone, else the original estimate minus the time logged (null without either)'
        remainingSet:
          type: boolean
          description: someone set the remaining estimate (else it follows the time logged)
        spentMinutes:
          type: integer
          description: time logged, in minutes
        startDate:
          type:
          - string
          - 'null'
          format: date
          description: YYYY-MM-DD
        dueDate:
          type:
          - string
          - 'null'
          format: date
          description: YYYY-MM-DD
        rank:
          type: number
          description: position in backlogs and board columns (lower first)
        labels:
          type: array
          items:
            type: string
        custom:
          type: object
          additionalProperties: true
          description: custom field values by field id (see CustomField for the value of each kind)
        resolvedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: when it reached a done status
        resolution:
          type:
          - string
          - 'null'
          description: 'why a done issue is done (one of the project''s resolutions: Done, Won''t do, …); null while open'
        security:
          anyOf:
          - $ref: '#/components/schemas/Named'
          - type: 'null'
          description: 'a private issue''s security level (see SecurityLevel); null: everyone in the project sees it'
        statusChangedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        childCount:
          type: integer
          description: sub-tasks / child issues
        childDone:
          type: integer
          description: of those, done
        commentCount:
          type: integer
        votes:
          type: integer
          description: how many people voted for it
        pullRequest:
          type: string
          enum:
          - open
          - merged
          - closed
          description: state of a linked pull request (an open one first); only present when the Git integration linked one
        blocked:
          type: boolean
          description: an unfinished issue blocks it
        url:
          type: string
          format: uri
          description: the issue in the web app
      required:
      - id
      - key
      - number
      - projectId
      - projectKey
      - projectName
      - title
      - type
      - status
      - priority
      - spentMinutes
      - rank
      - labels
      - custom
      - statusChangedAt
      - createdAt
      - updatedAt
      - childCount
      - childDone
      - commentCount
      - blocked
      - url
      description: An issue as lists, boards, search results and webhooks show it.
    IssueLink:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: 'the link type''s key: blocks, relates, duplicates, clones or one of the workspace''s own (GET /link-types)'
        label:
          type: string
          description: the link as read from this issue (blocks, is blocked by, relates to, …, or the workspace's names)
        outward:
          type: boolean
          description: this issue is the link's source
        dependency:
          type: boolean
          description: the link's target is blocked while its source is open
        builtin:
          type: boolean
          description: a built-in type under its own name (label is the English name)
        issue:
          $ref: '#/components/schemas/IssueSummary'
      required:
      - id
      - kind
      - label
      - outward
      - dependency
      - builtin
      - issue
    LinkType:
      type: object
      properties:
        key:
          type: string
          description: what links store and TQL takes (link = causes)
        outward:
          type: string
          description: how it reads from the link's source, e.g. causes
        inward:
          type: string
          description: how it reads from its target, e.g. is caused by (the same for types without a direction)
        dependency:
          type: boolean
          description: the target is blocked while the source is open (blocks, and types marked so)
        builtin:
          type: boolean
          description: blocks, relates, duplicates, clones
        renamed:
          type: boolean
          description: a built-in type with names of the workspace's own
        symmetric:
          type: boolean
          description: reads the same both ways
        linkCount:
          type: integer
          description: links of this type in the workspace
      required:
      - key
      - outward
      - inward
      - dependency
      - builtin
      - renamed
      - symmetric
      - linkCount
      description: A type of link between issues.
    WebLink:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        title:
          type: string
        kind:
          type: string
          enum:
          - web
          - wiki
          description: 'wiki: a WikiCraft page'
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - url
      - title
      - kind
    IssueAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mime:
          type: string
        size:
          type: integer
          description: bytes
        uploadedBy:
          type:
          - string
          - 'null'
          description: uploader's name
        createdAt:
          type: string
          format: date-time
        url:
          type: string
          description: download path (/api/attachments/{id})
      required:
      - id
      - name
      - mime
      - size
      - url
    SlaGoal:
      type: object
      properties:
        goal:
          type: string
          enum:
          - response
          - resolution
        targetMinutes:
          type: integer
        elapsedMinutes:
          type: integer
        dueAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - running
          - atRisk
          - breached
          - met
        stopped:
          type: boolean
          description: the clock stopped (responded / resolved)
      required:
      - goal
      - targetMinutes
      - elapsedMinutes
      - dueAt
      - state
      - stopped
      description: A service-level goal of an issue (calendar hours from the project's settings).
    IssueRequester:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type:
          - string
          - 'null'
        mail:
          type: boolean
          description: 'outgoing e-mail works: comments for the requester are e-mailed and they can sign in to the portal'
        source:
          type: string
          description: 'where the request came from: email, form or portal'
        organization:
          anyOf:
          - $ref: '#/components/schemas/Named'
          - type: 'null'
          description: the requester's organization
        shared:
          type: boolean
          description: the organization's members follow it in their portal
      required:
      - email
      description: Who an issue was opened for (a requester without an account).
    Issue:
      description: One issue with everything the issue page shows.
      allOf:
      - $ref: '#/components/schemas/IssueSummary'
      - type: object
        properties:
          description:
            anyOf:
            - $ref: '#/components/schemas/PmNode'
            - type: 'null'
            description: rich text (ProseMirror JSON)
          watchers:
            type: array
            items:
              $ref: '#/components/schemas/Named'
          watching:
            type: boolean
            description: the caller watches it
          voters:
            type: array
            items:
              $ref: '#/components/schemas/Named'
            description: who voted for it, first vote first
          voted:
            type: boolean
            description: the caller voted for it
          links:
            type: array
            items:
              $ref: '#/components/schemas/IssueLink'
            description: links to issues the caller can see
          webLinks:
            type: array
            items:
              $ref: '#/components/schemas/WebLink'
          attachments:
            type: array
            items:
              $ref: '#/components/schemas/IssueAttachment'
          children:
            type: array
            items:
              $ref: '#/components/schemas/IssueSummary'
            description: sub-tasks / issues of the epic, by rank
          sla:
            type: array
            items:
              $ref: '#/components/schemas/SlaGoal'
          approval:
            type:
            - object
            - 'null'
            properties:
              id:
                type: string
                format: uuid
              statusName:
                type: string
            required:
            - id
            - statusName
            description: 'the approval request it waits on (details: GET /issues/{key}/approvals)'
          assets:
            type: array
            items:
              $ref: '#/components/schemas/AssetSummary'
            description: the assets it is about (the ones the caller may see)
          requester:
            anyOf:
            - $ref: '#/components/schemas/IssueRequester'
            - type: 'null'
          permissions:
            type: object
            properties:
              edit:
                type: boolean
              comment:
                type: boolean
              admin:
                type: boolean
            description: what the caller may do
        required:
        - description
        - watchers
        - watching
        - links
        - webLinks
        - attachments
        - children
        - sla
        - requester
        - permissions
    IssueFields:
      type: object
      properties:
        title:
          type: string
          description: 1–500 characters (whitespace collapsed)
        description:
          oneOf:
          - $ref: '#/components/schemas/PmNode'
          - type: string
            description: plain text
          - type: 'null'
          description: rich text (ProseMirror JSON), plain text, or null to clear
        descriptionMarkdown:
          type: string
          description: the description as Markdown (instead of `description`)
        typeId:
          type: string
          format: uuid
          description: an issue type of the project
        statusId:
          type: string
          format: uuid
          description: a status of the project (restricted workflows only allow configured transitions; the status's rules
            may require fields, a comment or a resolution, see StatusRules)
        resolution:
          type:
          - string
          - 'null'
          description: 'for done issues: one of the project''s resolutions (matched by name, any case); entering a done status
            without one sets the status''s default or the first; leaving done clears it'
        comment:
          type: string
          description: 'a comment (Markdown) added with the change: what a status''s rules may ask for when moving into it'
        priority:
          oneOf:
          - $ref: '#/components/schemas/Priority'
          - type: integer
            minimum: 0
            maximum: 4
          description: name, or 0 (none) to 4 (urgent)
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
          description: someone with access to the project; null unassigns
        reporterId:
          type:
          - string
          - 'null'
          format: uuid
        parentId:
          type:
          - string
          - 'null'
          format: uuid
          description: parent issue or epic
        parentKey:
          type:
          - string
          - 'null'
          description: parent by key instead of id ("" or null clears)
        sprintId:
          type:
          - string
          - 'null'
          format: uuid
          description: a future or active sprint of the project; null = the backlog
        versionIds:
          type: array
          items:
            type: string
            format: uuid
          description: the releases it's fixed in (the project's own); replaces the list
        affectedVersionIds:
          type: array
          items:
            type: string
            format: uuid
          description: the releases it was found in; replaces the list
        componentIds:
          type: array
          items:
            type: string
            format: uuid
          description: its components; replaces the list
        versionId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'one release (or null): replaces the list of releases it''s fixed in'
        componentId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'one component (or null): replaces the list of components'
        securityLevelId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'make the issue private with one of the project''s security levels, or null to make it public. Creating
            an issue, any level of the project (the default level applies when left out); changing it later, as the project''s
            `setSecurity` permission allows and only to a level you belong to (project admins: any)'
        storyPoints:
          type:
          - number
          - 'null'
        estimateMinutes:
          type:
          - number
          - 'null'
          description: the original estimate, rounded to whole minutes
        remainingMinutes:
          type:
          - number
          - 'null'
          description: 'the remaining estimate; null: follow the original estimate minus the time logged'
        startDate:
          type:
          - string
          - 'null'
          format: date
          description: YYYY-MM-DD
        dueDate:
          type:
          - string
          - 'null'
          format: date
          description: YYYY-MM-DD
        labels:
          type: array
          items:
            type: string
          description: 'replaces the labels: lower-cased, spaces become dashes, 60 characters each, at most 30'
        custom:
          type: object
          additionalProperties:
            description: any JSON value
          description: 'custom field values by field id, merged into the current ones (null clears one): text (2,000 characters),
            number, date (YYYY-MM-DD), checkbox (true/false), user (person id), url, select (an option id), multiselect (a
            list of option ids)'
      description: Fields of an issue that can be set. Only the fields sent change. Read-only fields an issue carries (id,
        key, number, projectId, projectKey, url, rank, createdAt, updatedAt) are ignored, any other unknown field is a 400.
    NewIssue:
      description: 'A new issue: `projectKey` (or `projectId`), `title` and any IssueFields.'
      allOf:
      - $ref: '#/components/schemas/IssueFields'
      - type: object
        properties:
          projectKey:
            type: string
            description: project key (or id)
          projectId:
            type: string
            description: instead of projectKey
          templateId:
            type: string
            format: uuid
            description: start from this issue template of the project (title and description given here override it)
          after:
            type: string
            format: uuid
            description: place it right after this issue in the backlog / board column
        required:
        - title
    IssueEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor:
          anyOf:
          - $ref: '#/components/schemas/Named'
          - type: 'null'
          description: 'who did it (null: the system, automation or an import)'
        kind:
          type: string
          description: 'created, field (a field changed: see field), comment, worklog, link, attachment, dev (Git development
            link), moved, deleted, restored'
        field:
          type:
          - string
          - 'null'
          description: 'the changed field: title, description, type, status, priority, assignee, reporter, parent, sprint,
            version, component, points, estimate, start, due, labels, custom, link, webLink, project, …'
        old:
          description: 'previous value (shape depends on the field; status: {id, name, category})'
        new:
          description: new value
        at:
          type: string
          format: date-time
      required:
      - id
      - kind
      - at
      description: An entry of an issue's history.
    SearchResult:
      type: object
      properties:
        total:
          type: integer
          description: all matches (not just this page)
        issues:
          type: array
          items:
            $ref: '#/components/schemas/IssueSummary'
      required:
      - total
      - issues
    Status:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: '#/components/schemas/StatusCategory'
        color:
          type:
          - string
          - 'null'
        position:
          type: number
        rules:
          $ref: '#/components/schemas/StatusRules'
        approval:
          anyOf:
          - $ref: '#/components/schemas/ApprovalConfig'
          - type: 'null'
          description: 'the status waits for a decision (null: it doesn''t)'
      required:
      - id
      - name
      - category
    StatusRules:
      type: object
      properties:
        who:
          type: string
          enum:
          - everyone
          - admins
          - teams
          description: who may move issues into the status (project admins always may); default everyone who can edit
        teams:
          type: array
          items:
            type: string
            format: uuid
          description: 'with who = teams: the teams whose members may'
        require:
          type: array
          items:
            type: string
          description: 'fields the issue must have afterwards: assignee, resolution, version, component, dueDate, startDate,
            estimate, storyPoints, custom:<field id>'
        comment:
          type: string
          enum:
          - 'off'
          - optional
          - required
          description: whether a comment comes with the move (`comment` in the change)
        resolution:
          type: string
          description: 'done statuses: the resolution set when none is chosen'
      description: What it takes for a person to move an issue into the status (automation and imports aren't held up). A
        refused move answers 403 (who) or 400 naming what's missing.
    IssueType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        level:
          type: integer
          description: 1 = epic, 0 = standard, -1 = sub-task
        template:
          anyOf:
          - $ref: '#/components/schemas/PmNode'
          - type: 'null'
          description: description new issues of this type start with
        fields:
          $ref: '#/components/schemas/TypeFields'
      required:
      - id
      - name
      - icon
      - color
      - level
    TypeFields:
      type: object
      properties:
        hidden:
          type: array
          items:
            type: string
          description: 'fields issues of this type don''t show unless they have a value: assignee, priority, labels, sprint,
            version, affects, component, storyPoints, estimate, startDate, dueDate, security, custom:<id>'
        required:
          type: array
          items:
            type: string
          description: fields people must fill in when creating such an issue or changing an issue to this type, and can't
            empty (the same names but priority, sprint and security); automation and imports aren't held to them
      description: Which fields an issue type hides and requires.
    Version:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - unreleased
          - released
          - archived
        startDate:
          type:
          - string
          - 'null'
          format: date
          description: YYYY-MM-DD
        releaseDate:
          type:
          - string
          - 'null'
          format: date
          description: YYYY-MM-DD
        releasedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - name
      - status
      description: A version (release).
    Component:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        leadId:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - id
      - name
    SecurityLevel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        minRole:
          type: string
          enum:
          - viewer
          - member
          nullable: true
          description: 'everyone with at least this project role sees its issues; null: only the teams and people listed'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Named'
        users:
          type: array
          items:
            $ref: '#/components/schemas/Named'
        isDefault:
          type: boolean
          description: new issues get it unless the person creating one chooses otherwise
        issueCount:
          type: integer
          description: issues that carry it
        mine:
          type: boolean
          description: the caller belongs to it (and may choose it)
      required:
      - id
      - name
      - minRole
      - teams
      - users
      - isDefault
      description: 'Private issues: an issue with a security level is seen only by those the level lists, project admins and
        the issue''s reporter, creator and assignee. Everyone else doesn''t find it anywhere — not by key, in lists, boards,
        search, reports that name issues, activity, live updates or notifications.'
    CustomFieldOption:
      type: object
      properties:
        id:
          type: string
          description: stable option id (generated when left out)
        label:
          type: string
        color:
          type:
          - string
          - 'null'
      required:
      - label
    CustomField:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
          - text
          - number
          - select
          - multiselect
          - date
          - user
          - checkbox
          - url
        options:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldOption'
          description: choices of select / multiselect fields
        description:
          type:
          - string
          - 'null'
      required:
      - id
      - name
      - kind
      - options
    Transition:
      type: object
      properties:
        from:
          type: string
          format: uuid
        to:
          type: string
          format: uuid
      required:
      - from
      - to
      description: An allowed move between two statuses (restricted workflows).
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: 2–10 upper-case letters or digits, starting with a letter
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        icon:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        kind:
          type: string
          enum:
          - scrum
          - kanban
          - tracker
          description: 'board style: scrum (sprints), kanban or tracker; the template it was made from is settings.template'
        leadId:
          type:
          - string
          - 'null'
          format: uuid
        parentId:
          type:
          - string
          - 'null'
          format: uuid
          description: the project it sits under (subprojects)
        defaultRole:
          type: string
          enum:
          - none
          - viewer
          - member
          - admin
          description: role of workspace members without a grant of their own
        settings:
          $ref: '#/components/schemas/ProjectSettings'
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type:
          - string
          - 'null'
          format: date-time
        role:
          type: string
          enum:
          - viewer
          - member
          - admin
          description: the caller's role in the project
        starred:
          type: boolean
        leadName:
          type:
          - string
          - 'null'
        customer:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            inherited:
              type: boolean
              description: it has it from the project above
          required:
          - id
          - name
          - inherited
          description: 'whose project it is: time logged in it is this customer''s'
        openCount:
          type: integer
          description: 'list only: open issues'
        doneCount:
          type: integer
          description: 'list only: done issues'
        activeSprint:
          type:
          - string
          - 'null'
          description: 'list only: name of the running sprint'
      required:
      - id
      - key
      - name
      - kind
      - defaultRole
      - settings
      - createdAt
      - role
      description: A project as the project list shows it.
    ProjectDetail:
      description: A project with everything its screens need.
      allOf:
      - $ref: '#/components/schemas/Project'
      - type: object
        properties:
          statuses:
            type: array
            items:
              $ref: '#/components/schemas/Status'
            description: in workflow order
          types:
            type: array
            items:
              $ref: '#/components/schemas/IssueType'
          versions:
            type: array
            items:
              $ref: '#/components/schemas/Version'
          components:
            type: array
            items:
              $ref: '#/components/schemas/Component'
          fields:
            type: array
            items:
              $ref: '#/components/schemas/CustomField'
          securityLevels:
            type: array
            items:
              $ref: '#/components/schemas/SecurityLevel'
            description: in order
          sprints:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                goal:
                  type:
                  - string
                  - 'null'
                state:
                  type: string
                  enum:
                  - future
                  - active
                startAt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                endAt:
                  type:
                  - string
                  - 'null'
                  format: date-time
              required:
              - id
              - name
              - state
            description: open sprints (the running one first)
          boards:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                kind:
                  type: string
                  enum:
                  - scrum
                  - kanban
              required:
              - id
              - name
              - kind
          transitions:
            type: array
            items:
              $ref: '#/components/schemas/Transition'
        required:
        - statuses
        - types
        - versions
        - components
        - fields
        - sprints
        - boards
        - transitions
    WebhookEvent:
      type: object
      properties:
        event:
          type: string
          enum:
          - issue.created
          - issue.updated
          - issue.deleted
          - comment.created
          - sprint.started
          - sprint.completed
          - version.released
          - ping
        timestamp:
          type: string
          format: date-time
        webhookId:
          type: string
          format: uuid
        deliveryId:
          type: string
          format: uuid
          description: unique per delivery (retries of it keep it)
        data:
          oneOf:
          - type: object
            properties:
              issue:
                $ref: '#/components/schemas/IssueSummary'
              changed:
                type: array
                items:
                  type: string
                description: 'issue.updated: the changed fields (status, assignee, …)'
              previousKey:
                type: string
                description: 'moved to another project: the key it had'
            required:
            - issue
            description: issue.created, issue.updated, issue.deleted
          - type: object
            properties:
              issue:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                  title:
                    type: string
              comment:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  text:
                    type: string
                    description: the comment as plain text
            required:
            - issue
            - comment
            description: comment.created
          - type: object
            properties:
              sprint:
                $ref: '#/components/schemas/Named'
              stats:
                $ref: '#/components/schemas/SprintStats'
                description: 'sprint.completed: the sprint''s figures'
            required:
            - sprint
            description: sprint.started, sprint.completed
          - type: object
            properties:
              version:
                $ref: '#/components/schemas/Named'
              moved:
                type: integer
                description: unfinished issues moved on
            required:
            - version
            - moved
            description: version.released
          - type: object
            properties: {}
            description: 'ping: the test delivery of POST /admin/webhooks/{id}/test (sent once, not retried)'
          description: depends on the event
      required:
      - event
      - timestamp
      - webhookId
      - deliveryId
      - data
      description: 'The JSON body of a webhook delivery: a `POST` with `Content-Type: application/json`, `X-TaskCraft-Event:
        <event>` and `X-TaskCraft-Signature: sha256=<hex HMAC-SHA256 of the raw body with the webhook''s secret>`; failed
        deliveries are retried up to 7 times with growing pauses (30 seconds, 2 minutes, 8 minutes, … at most 4 hours; about
        11 hours in all).'
    Me:
      type: object
      properties:
        user:
          anyOf:
          - $ref: '#/components/schemas/User'
          - type: 'null'
          description: null when not signed in
        profile:
          type: object
          properties:
            title:
              type:
              - string
              - 'null'
              description: job title
            locale:
              type:
              - string
              - 'null'
              description: 'interface language (null: the workspace default, else the browser''s)'
            timezone:
              type:
              - string
              - 'null'
              description: IANA time zone
        preferences:
          $ref: '#/components/schemas/Preferences'
          description: without the WikiCraft token
        workspace:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            accentColor:
              type:
              - string
              - 'null'
              description: '#rrggbb'
            defaultLanguage:
              type:
              - string
              - 'null'
              description: interface language for people who haven't chosen one
            weekStart:
              description: 'first day of the week as an administrator set it (null: by language)'
            retention:
              description: retention rules (admins only; null for others)
            uploads:
              description: 'upload rules: {blockedTypes: [file endings], maxMb} (null: none)'
            timer:
              description: 'timers: {rounding (minutes), reminderHours}'
            virusScanning:
              type: boolean
              description: uploads are scanned for viruses (shown to admins; false for others)
            maxUploadMb:
              type: integer
              description: the server's largest upload (TASKCRAFT_MAX_UPLOAD_MB)
            timeZone:
              type:
              - string
              - 'null'
              description: default time zone (IANA) for people who haven't picked one
            currency:
              type:
              - string
              - 'null'
              description: the currency of hourly rates
            timeClosedUntil:
              type:
              - string
              - 'null'
              format: date
              description: 'time logs up to this day are closed (billed): only admins change them'
            dateFormat:
              type:
              - string
              - 'null'
              enum:
              - dmy
              - mdy
              - ymd
              - null
              description: 'how dates are written (null: as the language writes them)'
            announcement:
              type:
              - object
              - 'null'
              properties:
                id:
                  type: string
                  format: uuid
                text:
                  type: string
                tone:
                  type: string
                  enum:
                  - info
                  - warning
                until:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: shown until
                at:
                  type: string
                  format: date-time
              required:
              - id
              - text
              - tone
              description: the announcement for everyone while it's current
            features:
              type: object
              properties:
                timeTracking:
                  type: boolean
                votes:
                  type: boolean
                portal:
                  type: boolean
                automation:
                  type: boolean
                sharing:
                  type: boolean
                ai:
                  type: boolean
                calendarFeeds:
                  type: boolean
                agents:
                  type: boolean
                assets:
                  type: boolean
              description: parts of TaskCraft that are on
            ai:
              type: boolean
              description: AI assistance can be used (the server has a model and the workspace hasn't turned it off)
            aiSetup:
              type:
              - object
              - 'null'
              properties:
                provider:
                  type: string
                  enum:
                  - anthropic
                  - openai-compatible
                model:
                  type: string
                local:
                  type: boolean
                  description: the model runs in the server's own network
              description: the AI setup (admins only)
            logo:
              type:
              - string
              - 'null'
              description: 'the logo''s address (/api/workspace/logo?v=…); null: TaskCraft''s mark'
          required:
          - id
          - name
          description: null when not signed in
        wikicraft:
          type: object
          properties:
            url:
              type:
              - string
              - 'null'
              description: the connected WikiCraft (TASKCRAFT_WIKICRAFT_URL)
            connected:
              type: boolean
              description: page lookups work for this person (their own token or the shared one)
            personal:
              type: boolean
              description: the person connected their own WikiCraft token
        baseUrl:
          type: string
          format: uri
          description: TASKCRAFT_BASE_URL
        mustSetUpTwoFactor:
          type: boolean
          description: 'the workspace requires two-factor authentication and this person has no second factor yet: only the
            setup works until they add one'
      required:
      - user
      - workspace
      description: 'The signed-in person, their profile, preferences and workspace. Signed out: only `user` and `workspace`,
        both null.'
    Preferences:
      type: object
      description: Personal preferences, stored as a JSON object (20,000 characters at most); keys the server uses are listed,
        the web app keeps others (theme, board options, …).
      properties:
        email:
          type: string
          enum:
          - 'off'
          - instant
          - digest
          description: 'notification e-mails: off, immediately (bundled a couple of minutes after), or a daily digest at 08:00
            local time (the default)'
        muted:
          type: array
          items:
            type: string
          description: notification kinds that neither show nor get e-mailed (assigned, mentioned, commented, status, automation,
            sla, …)
        wikicraftToken:
          type: string
          description: the person's own WikiCraft API token (wct_…), so page lookups respect their wiki permissions; write-only,
            never returned
      additionalProperties: true
    SecondStep:
      type: object
      properties:
        mfaRequired:
          type: boolean
          description: always true
        mfaToken:
          type: string
          description: pass to POST /auth/mfa (and /auth/mfa/passkey); valid ten minutes
        methods:
          type: array
          items:
            type: string
            enum:
            - code
            - passkey
          description: 'second factors the person has: code (authenticator app or recovery code), passkey'
      required:
      - mfaRequired
      - mfaToken
      - methods
      description: 'A correct password of someone with a second factor: no session yet, the second step follows.'
    ApiToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scope:
          type: string
          enum:
          - read
          - write
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - name
      - scope
      - createdAt
      description: A personal API token (the secret itself is shown only when it is created).
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        userAgent:
          type:
          - string
          - 'null'
        ip:
          type:
          - string
          - 'null'
          description: client address as the session started
        current:
          type: boolean
          description: the session of this request
      required:
      - id
      - createdAt
      - lastSeenAt
      - expiresAt
      - current
      description: A browser where the person is signed in.
    Passkey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        backedUp:
          type: boolean
          description: synced to the person's other devices
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - name
      - backedUp
      - createdAt
    MfaStatus:
      type: object
      properties:
        enabled:
          type: boolean
          description: an authenticator app is set up
        enabledAt:
          type:
          - string
          - 'null'
          format: date-time
        recoveryCodesLeft:
          type: integer
        hasPassword:
          type: boolean
          description: the account has a local password (single sign-on accounts may not)
        passkeys:
          type: integer
          description: how many passkeys the person has
        required:
          type: boolean
          description: 'the workspace requires a second factor of this person: the last one can''t be removed'
      required:
      - enabled
      - recoveryCodesLeft
      - hasPassword
      - passkeys
      - required
    PasskeyAssertion:
      type: object
      properties:
        id:
          type: string
        rawId:
          type: string
          description: credential id, base64url
        type:
          type: string
          description: public-key
        response:
          type: object
          properties:
            clientDataJSON:
              type: string
              description: base64url
            authenticatorData:
              type: string
              description: base64url
            signature:
              type: string
              description: base64url
            userHandle:
              type:
              - string
              - 'null'
              description: base64url
          required:
          - clientDataJSON
          - authenticatorData
          - signature
      required:
      - rawId
      - response
      description: The answer of navigator.credentials.get(), as PublicKeyCredential.toJSON() writes it (binary values base64url).
    PasskeyRequestOptions:
      type: object
      properties:
        challenge:
          type: string
          description: base64url
        rpId:
          type: string
          description: the host name of TASKCRAFT_BASE_URL
        timeout:
          type: integer
          description: milliseconds
        userVerification:
          type: string
          enum:
          - preferred
          - required
          description: required for a sign-in with a passkey alone
        allowCredentials:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              id:
                type: string
                description: base64url
              transports:
                type: array
                items:
                  type: string
          description: the person's passkeys (empty for a sign-in with a passkey alone)
      required:
      - challenge
      - rpId
      - timeout
      - userVerification
      - allowCredentials
      description: '`publicKey` options for navigator.credentials.get() (binary values base64url).'
    SignInProvider:
      type: object
      properties:
        id:
          type: string
          description: provider id from the configuration
        name:
          type: string
          description: button label
        type:
          type: string
          enum:
          - oidc
          - github
          - ldap
          - saml
        preset:
          type:
          - string
          - 'null'
          enum:
          - microsoft
          - google
          - gitlab
          - null
          description: OpenID Connect preset
        loginUrl:
          type:
          - string
          - 'null'
          description: where the sign-in starts (/api/auth/sso/{id}/login); null for LDAP, which uses the password form
      required:
      - id
      - name
      - type
    SignInMethods:
      type: object
      properties:
        password:
          type: boolean
          description: signs in with a local password (and password sign-in is on)
        providers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              type:
                type:
                - string
                - 'null'
                enum:
                - oidc
                - github
                - ldap
                - saml
                - null
                description: 'null: the provider is no longer configured'
            required:
            - id
            - name
          description: single sign-on providers linked to the account
      required:
      - password
      - providers
      description: How a person signs in.
    SecurityPolicy:
      type: object
      properties:
        requireTwoFactor:
          type: string
          enum:
          - 'off'
          - admins
          - everyone
          description: 'who must have a second factor (admins: owners and admins)'
        enrolled:
          type: array
          items:
            type: string
            format: uuid
          description: people with a second factor
        people:
          type: object
          properties:
            total:
              type: integer
            enrolled:
              type: integer
          required:
          - total
          - enrolled
          description: active people, and how many have a second factor
        admins:
          type: object
          properties:
            total:
              type: integer
            enrolled:
              type: integer
          required:
          - total
          - enrolled
          description: active owners and admins, and how many have a second factor
      required:
      - requireTwoFactor
      - enrolled
      - people
      - admins
      description: The workspace's two-factor policy and who has a second factor.
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type:
          - string
          - 'null'
          description: null for guests asking
        role:
          type: string
          enum:
          - owner
          - admin
          - member
          - guest
        title:
          type:
          - string
          - 'null'
          description: job title
        photo:
          type:
          - string
          - 'null'
          description: the profile photo's address (/api/users/{id}/photo?v=…)
        awayUntil:
          type:
          - string
          - 'null'
          format: date
          description: away today, back after this day (see GET /absences)
        agent:
          type:
          - string
          - 'null'
          description: 'an AI agent''s @handle: assigning an issue to it or mentioning it starts it'
      required:
      - id
      - name
      - role
      description: Someone active in the workspace (people pickers, mentions).
    Absence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/Named'
        start:
          type: string
          format: date
          description: YYYY-MM-DD
        end:
          type: string
          format: date
          description: the last day away
        half:
          type:
          - string
          - 'null'
          enum:
          - am
          - pm
          - null
          description: half a day (start and end are the same day)
        kind:
          type:
          - string
          - 'null'
          enum:
          - vacation
          - sick
          - training
          - other
          - null
          description: why — only for the person and workspace admins
        note:
          type:
          - string
          - 'null'
          description: only for the person and workspace admins
        substitute:
          anyOf:
          - $ref: '#/components/schemas/Named'
          - type: 'null'
          description: told about new assignments and missed service-level goals meanwhile
        editable:
          type: boolean
          description: the caller may change or delete it
      required:
      - id
      - user
      - start
      - end
      - half
      - kind
      - note
      - substitute
      - editable
      description: Time someone is away.
    PersonDetail:
      description: A person's profile with their teams.
      allOf:
      - $ref: '#/components/schemas/Person'
      - type: object
        properties:
          status:
            type: string
            enum:
            - active
            - invited
            - deactivated
          teams:
            type: array
            items:
              $ref: '#/components/schemas/Named'
        required:
        - status
        - teams
    UserAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type:
          - string
          - 'null'
          description: null once removed
        role:
          type: string
          enum:
          - owner
          - admin
          - member
          - guest
        status:
          type: string
          enum:
          - active
          - invited
          - deactivated
        title:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type:
          - string
          - 'null'
          format: date-time
        removed:
          type: boolean
          description: removed for good (DELETE /users/{id}); kept as "Former user …" for history
        photo:
          type:
          - string
          - 'null'
          description: the profile photo's address
        signIn:
          anyOf:
          - $ref: '#/components/schemas/SignInMethods'
          - type: 'null'
      required:
      - id
      - name
      - role
      - status
      - createdAt
      - removed
      description: An account as user administration shows it.
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        memberIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - id
      - name
      - memberIds
      description: 'A team: people who can be given project roles together (provider groups can be mirrored into teams).'
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        domains:
          type: array
          items:
            type: string
          description: requesters from these mail domains join by themselves
        slaPercent:
          type: integer
          description: 'service-level goals as a share of the project''s (50: twice as fast)'
        memberCount:
          type: integer
        openRequests:
          type: integer
        number:
          type:
          - string
          - 'null'
          description: customer number
        contact:
          type:
          - string
          - 'null'
        archived:
          type: boolean
          description: kept in reports, not offered for new work
      required:
      - id
      - name
      - domains
      - slaPercent
      description: 'A requester organization: a customer whose people write to the service desk.'
    ApprovalConfig:
      type: object
      properties:
        steps:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: up to 60 characters
              approvers:
                type: array
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - user
                      - team
                      - role
                      - field
                      - assignee
                      - reporter
                      - requester
                      description: a person, a team's members, a project role, the person in a person field, the issue's assignee
                        or reporter, or its requester (who decides on the portal)
                    id:
                      type: string
                      format: uuid
                      description: 'user, team, field: which one'
                    role:
                      type: string
                      enum:
                      - admin
                      - member
                      description: 'role: project admins, or members and up'
                  required:
                  - kind
                description: 1 to 20; with nobody left to ask, the project's lead, else its admins
              quorum:
                type: string
                enum:
                - any
                - all
                - count
                - percent
                description: 'how many approvals the step needs (default any: one)'
              value:
                type: integer
                description: 'count: how many; percent: what share of those asked (rounded up)'
              rejection:
                type: string
                enum:
                - any
                - quorum
                description: 'any (default): one rejection fails the step; quorum: only when the approvals can''t be reached
                  any more'
            required:
            - approvers
          description: 1 to 5
        parallel:
          type: boolean
          description: 'all steps ask at once (default: one after another)'
        approvedStatusId:
          type: string
          format: uuid
          description: where the issue moves when every step is approved
        rejectedStatusId:
          type: string
          format: uuid
          description: where it moves when a step is rejected
        selfApproval:
          type: boolean
          description: whoever moved the issue into the status may be asked too (default false)
        remindHours:
          type: integer
          description: remind those who haven't decided, every so many hours (1 to 720)
        timeout:
          type: object
          properties:
            hours:
              type: integer
              description: 1 to 8760, counted from the start of a step
            action:
              type: string
              enum:
              - reassign
              - skip
              - reject
            userId:
              type: string
              format: uuid
              description: 'reassign: who is asked as well'
          required:
          - hours
          - action
          description: what happens to a step nobody decides in time
        pauseSla:
          type: boolean
          description: service-level clocks stand still while the issue waits
      required:
      - steps
      - approvedStatusId
      - rejectedStatusId
      description: 'An approval step on a status: an issue entering it opens a request; the decision moves it on, nobody takes
        those two moves by hand meanwhile, and leaving the status another way cancels the request.'
    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
        issueId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - cancelled
        statusId:
          type:
          - string
          - 'null'
          format: uuid
        statusName:
          type: string
        requestedBy:
          anyOf:
          - $ref: '#/components/schemas/Named'
          - type: 'null'
          description: 'who moved the issue into the status (null: automation)'
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type:
          - string
          - 'null'
          format: date-time
        parallel:
          type: boolean
        approvedStatusId:
          type: string
          format: uuid
        rejectedStatusId:
          type: string
          format: uuid
        steps:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              state:
                type: string
                enum:
                - waiting
                - pending
                - approved
                - rejected
                - skipped
                - cancelled
                description: 'waiting: an earlier step comes first'
              quorum:
                type: string
              value:
                type:
                - integer
                - 'null'
              needed:
                type: integer
                description: approvals it takes
              startedAt:
                type:
                - string
                - 'null'
                format: date-time
              decidedAt:
                type:
                - string
                - 'null'
                format: date-time
              dueAt:
                type:
                - string
                - 'null'
                format: date-time
                description: when its timeout strikes
              approvers:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    user:
                      anyOf:
                      - $ref: '#/components/schemas/Named'
                      - type: 'null'
                    email:
                      type:
                      - string
                      - 'null'
                      format: email
                      description: a requester without an account
                    decision:
                      type:
                      - string
                      - 'null'
                      enum:
                      - approved
                      - rejected
                      - null
                      description: 'null: still asked'
                    comment:
                      type:
                      - string
                      - 'null'
                    decidedAt:
                      type:
                      - string
                      - 'null'
                      format: date-time
                    for:
                      anyOf:
                      - $ref: '#/components/schemas/Named'
                      - type: 'null'
                      description: asked in this person's place (delegated, or their substitute while they're away)
                  required:
                  - id
            required:
            - id
            - name
            - state
            - approvers
        canDecide:
          type: array
          items:
            type: string
            format: uuid
          description: the open steps the caller is asked in
        canManage:
          type: boolean
          description: the caller may add approvers (project admins, while it's pending)
        issue:
          $ref: '#/components/schemas/IssueSummary'
          description: only in GET /approvals
      required:
      - id
      - issueId
      - state
      - statusName
      - steps
      - canDecide
      description: An approval request of an issue.
    SlaSettings:
      type: object
      description: 'Service-level goals in calendar hours per priority (0–8760; null removes one): time to first response
        and time to resolution. The response clock stops at the first move out of a to-do status or the first comment by someone
        other than the reporter; the resolution clock when the issue is done.'
      properties:
        response:
          type: object
          propertyNames:
            type: string
            enum:
            - none
            - low
            - medium
            - high
            - urgent
            description: issue priority
          additionalProperties:
            type:
            - number
            - 'null'
          description: 'hours to response by priority, e.g. {"urgent": 1, "high": 4}'
        resolution:
          type: object
          propertyNames:
            type: string
            enum:
            - none
            - low
            - medium
            - high
            - urgent
            description: issue priority
          additionalProperties:
            type:
            - number
            - 'null'
          description: 'hours to resolution by priority, e.g. {"urgent": 1, "high": 4}'
      additionalProperties: false
    ProjectSettings:
      type: object
      properties:
        estimation:
          type: string
          enum:
          - points
          - hours
          description: how work is estimated
        workflow:
          type: string
          enum:
          - free
          - restricted
          description: 'free: any status to any other; restricted: only the configured transitions (better set with PUT /projects/{key}/transitions)'
        sla:
          anyOf:
          - $ref: '#/components/schemas/SlaSettings'
          - type: 'null'
        wikiSpace:
          type: string
          description: WikiCraft space key for the project's docs and the pages it writes
        wikiParentPage:
          type: string
          description: WikiCraft page id new pages from the project go under
        defaultAssignee:
          type: string
          format: uuid
          description: who new issues without an assignee get
        doneAfterDays:
          type: number
          description: stored as given (not used by the server)
        permissions:
          type: object
          additionalProperties:
            type: string
            enum:
            - member
            - admin
            - nobody
          description: 'who may: deleteIssues, moveIssues, manageSprints, manageReleases (member or admin; default member),
            setSecurity (member or admin; default member), moderateComments and logTimeForOthers (member, admin or nobody;
            default admin), createBranches (member, admin or nobody; default member). Project admins may whatever members
            may.'
        resolutions:
          type: array
          items:
            type: string
          description: the project's resolutions, 1–20 distinct names (default Done, Won't do, Duplicate, Cannot reproduce);
            the first is the default
        template:
          type: string
          enum:
          - scrum
          - kanban
          - tracker
          - business
          readOnly: true
          description: the template the project was created from
        mailIn:
          type: object
          readOnly: true
          description: e-mail settings (GET/PUT /projects/{key}/mail-in)
        portal:
          type: object
          readOnly: true
          description: service desk settings (GET/PUT /projects/{key}/portal)
      description: Project settings. Changes merge into the current ones key by key (null removes a key); only estimation,
        workflow, sla, resolutions, permissions, wikiSpace, wikiParentPage, defaultAssignee and doneAfterDays can be set here,
        anything else is a 400.
      additionalProperties: true
    NewProject:
