      summary: Change your password
      operationId: changePassword
      description: Browser sessions only. Signs out your other sessions. The new password needs at least 8 characters; a wrong
        current password is a 403, and after 10 wrong ones in 15 minutes a 400. Not available when password sign-in is turned
        off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current:
                  type: string
                  description: the current password
                newPassword:
                  type: string
                  description: at least 8 characters
              required:
              - current
              - newPassword
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - session: []
  /me/preferences:
    put:
      tags:
      - Auth & account
      summary: Change your preferences
      operationId: updatePreferences
      description: Merges the keys sent into the stored preferences; null removes a key. `email` must be off, instant or digest;
        `wikicraftToken` must start with wct_.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/tokens:
    get:
      tags:
      - Auth & account
      summary: Your personal API tokens
      operationId: listApiTokens
      description: 'Browser sessions only: tokens are managed in the browser.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - session: []
    post:
      tags:
      - Auth & account
      summary: Create a personal API token (shown once)
      operationId: createApiToken
      description: Browser sessions only. A `read` token may only read and search (GET, POST /query/validate); `write` (the
        default) may do whatever its owner may, except changing sign-in methods and API tokens, which need the browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scope:
                  type: string
                  enum:
                  - read
                  - write
                  description: default write
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 3650
                  description: omit for a token that doesn't expire
              required:
              - name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  token:
                    type: string
                    description: the token (tct_…); it is not shown again
                required:
                - id
                - token
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - session: []
  /me/tokens/{id}:
    delete:
      tags:
      - Auth & account
      summary: Delete a personal API token
      operationId: deleteApiToken
      description: Browser sessions only. Answers 204 also for unknown ids.
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - session: []
  /me/photo:
    put:
      tags:
      - Auth & account
      summary: Set your profile photo
      operationId: putMyPhoto
      description: 'In the browser. The image itself is the body: PNG, JPEG, GIF or WebP up to 1 MB (the web app crops it
        to a 256 px square first).'
      requestBody:
        required: true
        content:
          image/webp:
            schema:
              type: string
              format: binary
              description: the image
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    type: string
                    description: its address
                required:
                - photo
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - session: []
    delete:
      tags:
      - Auth & account
      summary: Remove your profile photo
      operationId: deleteMyPhoto
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - session: []
  /me/export:
    get:
      tags:
      - Auth & account
      summary: Download everything about yourself
      operationId: exportMyData
      description: 'Everything TaskCraft keeps about the person as one JSON document (a download): profile and preferences,
        teams and project access, the issues they reported, created or are assigned (titles only of those they still see),
        their comments, time logs, attachments, watches, votes, saved filters, notifications, sign-in sessions and identities,
        passkeys and API tokens (never secrets), and their entries in the audit log.'
      responses:
        '200':
          description: taskcraft-personal-data.json (attachment)
          content:
            application/json:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/calendar-feeds:
    get:
      tags:
      - Auth & account
      summary: The caller's calendar feeds
      operationId: listCalendarFeeds
      description: 'Their addresses aren''t kept: they''re shown once, when a feed is made or renewed.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    kind:
                      type: string
                      enum:
                      - mine
                      - filter
                      - project
                    viewId:
                      type:
                      - string
                      - 'null'
                      format: uuid
                    viewName:
                      type:
                      - string
                      - 'null'
                    projectKey:
                      type:
                      - string
                      - 'null'
                    parts:
                      description: '{issues, sprints, releases}: false leaves a part out'
                    createdAt:
                      type: string
                      format: date-time
                    lastUsedAt:
                      type:
                      - string
                      - 'null'
                      format: date-time
                  required:
                  - id
                  - kind
                  - parts
                  - createdAt
                  - lastUsedAt
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Auth & account
      summary: Make a calendar feed
      operationId: createCalendarFeed
      description: 'A secret address calendar apps subscribe to (read as the caller: it shows what they may see). `mine`:
        issues assigned to the caller that have a due date, and the sprints and releases of the projects they belong to; `filter`:
        a saved filter''s issues with a due date (one they may see); `project`: a project''s issues with a due date, sprints
        and releases. When the workspace has calendar feeds turned off: 400.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - mine
                  - filter
                  - project
                viewId:
                  type: string
                  format: uuid
                  description: for filter
                projectKey:
                  type: string
                  description: for project
                parts:
                  type: object
                  properties:
                    issues:
                      type: boolean
                    sprints:
                      type: boolean
                    releases:
                      type: boolean
                    absences:
                      type: boolean
                  description: 'default: all'
              required:
              - kind
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  url:
                    type: string
                    format: uri
                    description: the feed's address, shown this once
                required:
                - id
                - url
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/calendar-feeds/{id}/renew:
    post:
      tags:
      - Auth & account
      summary: A new address for a calendar feed
      operationId: renewCalendarFeed
      description: The old address stops working.
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  url:
                    type: string
                    format: uri
                required:
                - id
                - url
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/calendar-feeds/{id}:
    delete:
      tags:
      - Auth & account
      summary: Delete a calendar feed
      operationId: deleteCalendarFeed
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /calendar/{token}:
    get:
      tags:
      - Auth & account
      summary: A calendar feed (iCalendar)
      operationId: getCalendarFeed
      description: 'No sign-in: the address is the secret (`{token}.ics`). All-day events for issues (from their start to
        their due date), sprints and releases. 404 when the feed is gone, its owner deactivated or the workspace turned feeds
        off.'
      parameters:
      - name: token
        in: path
        required: true
        description: the feed's secret, with .ics
        schema:
          type: string
      responses:
        '200':
          description: an iCalendar file
          content:
            text/calendar:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - {}
  /cli/logins:
    post:
      tags:
      - Auth & account
      summary: Start a sign-in of the command-line client
      operationId: startCliLogin
      description: No account needed. The client shows `url` (and `code`); the person approves there; the client polls POST
        /cli/token with `verifier`. Codes live ten minutes and work once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: how the client names itself, e.g. the computer's name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: ABCD-EFGH
                  verifier:
                    type: string
                    description: the client's secret
                  url:
                    type: string
                    format: uri
                  expiresIn:
                    type: integer
                    description: seconds
                  interval:
                    type: integer
                    description: seconds between polls
                required:
                - code
                - verifier
                - url
                - expiresIn
                - interval
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - {}
  /cli/logins/{code}:
    get:
      tags:
      - Auth & account
      summary: Which command-line client asks to sign in
      operationId: getCliLogin
      description: A session, not a token.
      parameters:
      - name: code
        in: path
        required: true
        description: the code the client shows
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  approved:
                    type: boolean
                required:
                - name
                - createdAt
                - approved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - session: []
    delete:
      tags:
      - Auth & account
      summary: Refuse a command-line client's sign-in
      operationId: denyCliLogin
      parameters:
      - name: code
        in: path
        required: true
        description: the code the client shows
        schema:
          type: string
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - session: []
  /cli/logins/{code}/approve:
    post:
      tags:
      - Auth & account
      summary: Let the command-line client act as you
      operationId: approveCliLogin
      description: A session, not a token. The client then receives an API token of its own (named "tc on …", listed under
        your API tokens).
      parameters:
      - name: code
        in: path
        required: true
        description: the code the client shows
        schema:
          type: string
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - session: []
  /cli/token:
    post:
      tags:
      - Auth & account
      summary: Pick up the command-line client's token
      operationId: takeCliToken
      description: 'No account needed: the verifier is the key. 202 while the person hasn''t approved; then, once, the token;
        404 when the sign-in ran out or was refused.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                verifier:
                  type: string
              required:
              - verifier
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: an API token (write)
                  user:
                    type: object
                    properties:
                      name:
                        type: string
                      email:
                        type:
                        - string
                        - 'null'
                    required:
                    - name
                required:
                - token
                - user
        '202':
          description: Not approved yet
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - {}
  /auth/mfa:
    post:
      tags:
      - Security
      summary: Complete a sign-in with a code or a passkey
      operationId: completeSecondStep
      description: 'The second step after a correct password: a code from the authenticator app or a recovery code, or a passkey''s
        answer (after POST /auth/mfa/passkey). The step comes from `mfaToken` (password sign-in) or the `tc_mfa` cookie (single
        sign-on, reset links). Five tries per sign-in, and wrong codes count against a per-person limit (10 per 15 minutes)
        a new sign-in doesn''t reset; each code works once. Sets the session cookie; `next` is where a single sign-on wanted
        to go.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mfaToken:
                  type: string
                  description: from the SecondStep answer; leave out when the step is in the tc_mfa cookie
                code:
                  type: string
                  description: six digits from the authenticator app, or a recovery code
                passkey:
                  $ref: '#/components/schemas/PasskeyAssertion'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  next:
                    type:
                    - string
                    - 'null'
                    description: path to continue at (single sign-on)
                required:
                - ok
          headers:
            Set-Cookie:
              schema:
                type: string
              description: the session cookie `tc_session` (HttpOnly, SameSite=Lax)
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - {}
  /auth/mfa/passkey:
    post:
      tags:
      - Security
      summary: Start the second step with a passkey
      operationId: startPasskeySecondStep
      description: Options for navigator.credentials.get() (null when the person has no passkey) and the second factors they
        have. Then POST /auth/mfa with `passkey`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mfaToken:
                  type: string
                  description: from the SecondStep answer; leave out when the step is in the tc_mfa cookie
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  methods:
                    type: array
                    items:
                      type: string
                      enum:
                      - code
                      - passkey
                  publicKey:
                    anyOf:
                    - $ref: '#/components/schemas/PasskeyRequestOptions'
                    - type: 'null'
                required:
                - methods
                - publicKey
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - {}
  /auth/passkey/options:
    post:
      tags:
      - Security
      summary: Start a sign-in with a passkey alone
      operationId: startPasskeySignIn
      description: Options for navigator.credentials.get() and a token for POST /auth/passkey (valid ten minutes). Off (400)
        when password sign-in is turned off.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  publicKey:
                    $ref: '#/components/schemas/PasskeyRequestOptions'
                required:
                - token
                - publicKey
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - {}
  /auth/passkey:
    post:
      tags:
      - Security
      summary: Sign in with a passkey that verified you
      operationId: signInWithPasskey
      description: 'The passkey must have verified the person (PIN, fingerprint, face): that is two factors in one, no password
        and no second step. Otherwise 400 — sign in with the password and use the passkey as the second step.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: from POST /auth/passkey/options
                credential:
                  $ref: '#/components/schemas/PasskeyAssertion'
              required:
              - token
              - credential
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: always true
                required:
                - ok
          headers:
            Set-Cookie:
              schema:
                type: string
              description: the session cookie `tc_session` (HttpOnly, SameSite=Lax)
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - {}
  /me/sessions:
    get:
      tags:
      - Security
      summary: Where you're signed in
      operationId: listSessions
      description: Browser sessions that haven't expired, this one first, then by last activity.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/sessions/revoke-others:
    post:
      tags:
      - Security
      summary: Sign out everywhere else
      operationId: signOutOtherSessions
      description: Browser sessions only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: integer
                    description: sessions signed out
                required:
                - revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - session: []
  /me/sessions/{id}:
    delete:
      tags:
      - Security
      summary: Sign out one session
      operationId: signOutSession
      description: Browser sessions only.
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - session: []
  /me/mfa:
    get:
      tags:
      - Security
      summary: Your two-factor authentication status
      operationId: getTwoFactorStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/mfa/setup:
    post:
      tags:
      - Security
      summary: Start setting up an authenticator app
      operationId: startTwoFactorSetup
      description: A new secret, its otpauth:// address and a QR code; it takes effect once confirmed with POST /me/mfa/enable.
        Needs a sign-in from the last 15 minutes or the password (else 403). 400 when an app is already set up (turn it off
        first). Browser sessions only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: your password; not needed within 15 minutes of signing in
              description: Confirms a change to sign-in methods.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    description: base32 secret, to type in by hand
                  uri:
                    type: string
                    description: otpauth://totp/… address
                  qrSvg:
                    type: string
                    description: the address as a QR code (SVG)
                required:
                - secret
                - uri
                - qrSvg
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - session: []
  /me/mfa/enable:
    post:
      tags:
      - Security
      summary: Confirm the authenticator app with a code
      operationId: enableTwoFactor
      description: Turns the app on and returns ten one-time recovery codes (shown once). Browser sessions only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: the app's current six-digit code
              required:
              - code
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
                required:
                - recoveryCodes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - session: []
  /me/mfa/disable:
    post:
      tags:
