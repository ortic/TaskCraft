        description:
          type: string
        icon:
          type: string
          description: default rocket
        color:
          type: string
          description: '#rrggbb, default #4f6bed'
        leadId:
          type: string
          format: uuid
          description: 'project lead (default: the caller)'
      required:
      - key
      - name
    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
          description: 'a new key: the old one keeps working for links and issue keys (409 when taken now or before by another
            project)'
        description:
          type:
          - string
          - 'null'
          description: empty clears
        icon:
          type:
          - string
          - 'null'
        color:
          type:
          - string
          - 'null'
        leadId:
          type:
          - string
          - 'null'
          format: uuid
        parentId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'make it a subproject of another project the caller sees (not one below it; three levels at most);
            null: top level'
        customerId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'the customer the project belongs to (an organization); null: none, or the one of the project above'
        defaultRole:
          type: string
          enum:
          - none
          - viewer
          - member
          - admin
          description: role of workspace members without a grant
        settings:
          $ref: '#/components/schemas/ProjectSettings'
      description: Only the fields sent change; unknown fields are a 400.
    ProjectGrant:
      type: object
      properties:
        subjectType:
          type: string
          enum:
          - user
          - team
        subjectId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - viewer
          - member
          - admin
        name:
          type:
          - string
          - 'null'
          description: the person's or team's name
          readOnly: true
      required:
      - subjectType
      - subjectId
      - role
      description: A project role granted to a person or a team.
    ProjectMembers:
      type: object
      properties:
        defaultRole:
          type: string
          enum:
          - none
          - viewer
          - member
          - admin
        grants:
          type: array
          items:
            $ref: '#/components/schemas/ProjectGrant'
        people:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              role:
                type: string
                enum:
                - viewer
                - member
                - admin
            required:
            - id
            - name
            - role
          description: everyone active who can see the project, with their effective role (for assignee pickers)
      required:
      - defaultRole
      - grants
      - people
    Schedule:
      type: object
      properties:
        every:
          type: string
          enum:
          - hour
          - day
          - weekday
          - week
          - month
        at:
          type: string
          description: local time HH:MM (default 08:00; for hour only the minutes count)
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          default: 1
          description: 'for week: Monday = 1 … Sunday = 7'
        day:
          type: integer
          minimum: 1
          maximum: 28
          default: 1
          description: 'for month: day of the month'
        tz:
          type: string
          description: IANA time zone the times are in (default UTC), e.g. Europe/Zurich
      required:
      - every
      description: When a scheduled rule or recurring template runs (checked once a minute).
    AutomationTrigger:
      type: object
      properties:
        event:
          type: string
          enum:
          - created
          - status
          - assigned
          - field
          - commented
          - approved
          - rejected
          - schedule
          description: 'approved / rejected: an approval request of the issue was decided'
        fromStatusId:
          type: string
          format: uuid
          description: 'status: only moves from this status'
        toStatusId:
          type: string
          format: uuid
          description: 'status: only moves to this status'
        toCategory:
          $ref: '#/components/schemas/StatusCategory'
          description: 'status: only moves into this category'
        field:
          type: string
          description: 'field: the changed field as the history names it (status, assignee, priority, labels, sprint, due,
            custom, …)'
        schedule:
          $ref: '#/components/schemas/Schedule'
          description: 'schedule: when the rule runs (it then acts on every issue matching its condition, up to 200)'
      required:
      - event
      description: 'When a rule runs: an issue is created, changes status, is assigned, a field changes, someone comments,
        or on a schedule.'
    AutomationAction:
      type: object
      properties:
        action:
          type: string
          enum:
          - setStatus
          - assign
          - setPriority
          - addLabel
          - removeLabel
          - setSprint
          - comment
          - notify
          - chat
          - script
          - extension
        script:
          type: string
          description: 'script: a sandboxed script (Rhai) with the issue in scope as `issue`; it changes that issue with set(field,
            value), set_field(custom field, value), add_label, remove_label and comment. Checked when the rule is saved; up
            to 64 KB'
        extension:
          type: string
          description: 'extension: the installed extension''s name'
        name:
          type: string
          description: 'extension: which of its actions (GET /extensions/actions)'
        params:
          description: 'extension: handed to the action'
        statusId:
          type: string
          format: uuid
          description: setStatus
        to:
          type: string
          description: 'assign: reporter or nobody (else userId); notify: assignee (default), reporter, watchers or lead (userId
            wins)'
        userId:
          type: string
          format: uuid
          description: 'assign / notify: this person'
        priority:
          $ref: '#/components/schemas/Priority'
          description: setPriority
        label:
          type: string
          description: addLabel / removeLabel
        sprint:
          type: string
          description: 'setSprint: active = the running sprint, anything else = the backlog'
        text:
          type: string
          description: 'comment: Markdown'
        message:
          type: string
          description: 'notify: up to 300 characters; chat: the message, with {key}, {title}, {status}, {assignee}, {priority},
            {project} and {url} filled in (default `{key} {title}`)'
        url:
          type: string
          format: uri
          description: 'chat: the channel''s incoming-webhook address'
        format:
          type: string
          enum:
          - slack
          - teams
          - google-chat
          description: 'chat: the chat service (default slack); nothing is posted about private issues'
      required:
      - action
      description: Something a rule does. Rules act as Automation (no person); their changes may trigger other rules, up to
        three rounds deep.
    AutomationRuleInput:
      type: object
      properties:
        name:
          type: string
          description: default Rule
        enabled:
          type: boolean
          description: default true
        trigger:
          $ref: '#/components/schemas/AutomationTrigger'
        condition:
          type: string
          description: TQL the issue must match (empty = every issue; required for scheduled rules), e.g. type = Bug and priority
            >= high
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AutomationAction'
          description: 1–10 actions
      required:
      - trigger
      - actions
    AutomationRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        enabled:
          type: boolean
        trigger:
          $ref: '#/components/schemas/AutomationTrigger'
        condition:
          type: string
          description: TQL (empty = every issue)
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AutomationAction'
        runs:
          type: integer
          description: how often it acted
        lastRunAt:
          type:
          - string
          - 'null'
          format: date-time
        nextRunAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 'scheduled rules: the next run'
        lastError:
          type:
          - string
          - 'null'
          description: why its last run failed (a script's mistake, a missing extension); cleared by the next run that works
      required:
      - id
      - name
      - enabled
      - trigger
      - condition
      - actions
      - runs
    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        title:
          type: string
          description: title of the issues it creates; {date}, {week} and {month} become 2026-11-12, 2026-W46 and 2026-11
        description:
          anyOf:
          - $ref: '#/components/schemas/PmNode'
          - type: 'null'
        fields:
          type: object
          properties:
            typeId:
              type: string
              format: uuid
            priority:
              $ref: '#/components/schemas/Priority'
            labels:
              type: array
              items:
                type: string
            assigneeId:
              type: string
              format: uuid
            storyPoints:
              type: number
            estimateMinutes:
              type: number
            parentId:
              type: string
              format: uuid
            componentId:
              type: string
              format: uuid
            versionId:
              type: string
              format: uuid
            componentIds:
              type: array
              items:
                type: string
                format: uuid
            versionIds:
              type: array
              items:
                type: string
                format: uuid
            affectedVersionIds:
              type: array
              items:
                type: string
                format: uuid
            dueInDays:
              type: integer
              description: due this many days after the issue is created (0–3650)
            sprint:
              type: string
              enum:
              - active
              description: put it into the running sprint (if there is one)
            custom:
              type: object
              additionalProperties: true
              description: custom field values by field id
          description: Fields the issue starts with (other keys are dropped); checked when an issue is created from it.
        subtasks:
          type: array
          items:
            type: string
          description: titles of sub-tasks created with it (the project's sub-task type)
        schedule:
          anyOf:
          - $ref: '#/components/schemas/Schedule'
          - type: 'null'
          description: a recurring template creates its issue by itself (in the name of whoever last changed it)
        nextRunAt:
          type:
          - string
          - 'null'
          format: date-time
        lastRunAt:
          type:
          - string
          - 'null'
          format: date-time
        lastIssueKey:
          type:
          - string
          - 'null'
          description: the issue it created last on its schedule
      required:
      - id
      - name
      - title
      - description
      - fields
      - subtasks
      - schedule
      description: An issue template (a recurring issue when it has a schedule).
    TemplateInput:
      type: object
      properties:
