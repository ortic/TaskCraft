                    properties:
                      name:
                        type: string
                      handle:
                        type: string
                      instructions:
                        type: string
                    required:
                    - name
                  issue:
                    type: object
                    additionalProperties: true
                    description: key, title, type, status, priority, labels, url, description and the comments everyone may
