                        startDate:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: YYYY-MM-DD
                        dueDate:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: YYYY-MM-DD
                        updatedAt:
                          type: string
                          format: date-time
                        resolvedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
                        labels:
                          type: array
