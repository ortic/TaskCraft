                  $ref: '#/components/schemas/Worklog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Comments & time
      summary: Log time on an issue
      operationId: logWork
      description: Project members, as themselves or — with `userId` — for someone else where the project's `logTimeForOthers`
        permission allows it (project admins by default). `minutes`, or `time` like `1h 30m`, `45m`, `1.5h`, `2d` (8-hour
        days), `1w` (5 days); at most a week. The issue's time spent is updated, and its remaining estimate as `remaining`
        says.
      parameters:
      - name: key
        in: path
        required: true
        description: issue key (e.g. WEB-12; former keys keep working) or issue id
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes:
                  type: number
                  description: time spent in minutes (instead of time)
                userId:
                  type: string
                  format: uuid
                  description: 'whose time it is (default: the caller)'
                time:
                  type: string
                  description: 'time spent as a duration: 1h 30m, 45m, 1.5h, 2d'
                date:
                  type: string
                  format: date
                  description: 'the day worked (default: today)'
                note:
                  type: string
                categoryId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: a time category (not an archived one)
                billable:
                  type: boolean
                  description: 'default: the category''s setting, else false'
                customerId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: book it to another customer than the project's (an organization that isn't archived)
                draftId:
                  type: string
                  format: uuid
                  description: a time draft of the caller's on this issue, which this log replaces (409 when it was booked
                    already)
                remaining:
                  oneOf:
                  - type: string
                    enum:
                    - auto
                    - keep
                  - type: string
                    description: a new remaining estimate such as 3h
                  - type: number
                    description: a new remaining estimate in minutes
                  description: 'the remaining estimate afterwards: auto (default: down by the time logged — by itself unless
                    someone set it), keep (as it was before this log), or a new value'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  minutes:
                    type: integer
                required:
                - id
                - minutes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
