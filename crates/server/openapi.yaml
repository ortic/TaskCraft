          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type:
                    - string
                    - 'null'
                    description: send as x-share-key
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - {}
  /share/{token}/issues:
