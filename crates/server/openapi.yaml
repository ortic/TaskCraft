                name:
                  type: string
                  description: up to 80 characters (default Passkey)
                credential:
                  type: object
                  properties:
                    rawId:
                      type: string
                      description: base64url
                    response:
                      type: object
                      properties:
                        clientDataJSON:
                          type: string
                          description: base64url
                        attestationObject:
                          type: string
                          description: base64url
                        transports:
                          type: array
                          items:
                            type: string
                      required:
                      - clientDataJSON
                      - attestationObject
                  required:
                  - rawId
                  - response
              required:
              - token
              - credential
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
