                  type: string
                  format: uuid
                  description: new status (column)
                sprintId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: 'present: move into this sprint; null = the backlog'
                after:
                  type: string
                  format: uuid
                  description: place it right after this issue
                before:
                  type: string
                  format: uuid
                  description: place it right before this issue
                fields:
