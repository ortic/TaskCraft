                          format: uuid
                        customer:
                          anyOf:
                          - $ref: '#/components/schemas/Named'
                          - type: 'null'
                        category:
                          anyOf:
                          - $ref: '#/components/schemas/Named'
                          - type: 'null'
                        user:
                          anyOf:
                          - $ref: '#/components/schemas/Named'
                          - type: 'null'
                        rate:
                          type: number
                          description: per hour
                      required:
                      - id
                      - rate
                required:
                - rates
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
      - Comments & time
      summary: Replace the hourly rates (workspace admins)
      operationId: setTimeRates
      description: 'Amounts show in the time report and its CSV for workspace admins: billable time at its rate. A rate is
        for a customer, a time category, a person, or a combination (none of them: the default); the most specific one that
        fits a time log counts — a customer before a person before a category.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rates:
                  type: array
                  items:
                    type: object
                    properties:
                      customerId:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      categoryId:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      userId:
                        type:
                        - string
                        - 'null'
                        format: uuid
                      rate:
                        type: number
                        description: 0 to 100000
                    required:
                    - rate
                  description: up to 500
              required:
              - rates
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /issues/{key}/attachments:
    post:
      tags:
      - Attachments
      summary: Attach files to an issue
      operationId: uploadAttachments
      description: 'Project members. Every multipart part with a file name is stored (names up to 200 characters); each file
        may be up to TASKCRAFT_MAX_UPLOAD_MB (413 otherwise). The workspace''s upload rules apply (400: a blocked file type
        or larger than its limit), and with TASKCRAFT_CLAMAV_ADDRESS every file is scanned first: 400 when it looks infected
        (recorded as file.infected in the audit log) or the scanner can''t be reached (unless TASKCRAFT_CLAMAV_FAIL_OPEN).
        When one file is refused, none is stored.'
      parameters:
      - name: key
        in: path
        required: true
        description: issue key (e.g. WEB-12; former keys keep working) or issue id
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: one or more files (any part name works)
              required:
              - file
      responses:
        '201':
          description: Stored, in upload order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueAttachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
  /attachments/{id}:
    get:
      tags:
      - Attachments
      summary: Download a file
      operationId: downloadAttachment
      description: Anyone who can see the issue. Images (not SVG), PDFs, videos and plain text are served inline with their
        type, everything else as `application/octet-stream` for download; always sandboxed (Content-Security-Policy).
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The file
          headers:
            Content-Disposition:
              schema:
                type: string
              description: inline or attachment, with the file name
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Attachments
      summary: Delete a file
      operationId: deleteAttachment
      description: Project members.
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /ai/tql:
    post:
      tags:
      - Search & TQL
      summary: A question in plain words as a TQL query
      operationId: askTql
      description: AI writes the query (checked, with one retry); run it with /search. Only the question and the names of
        projects, statuses, types, fields and labels are sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  description: up to 500 characters
                project:
                  type: string
                  description: 'a project key: the question is about it'
                lang:
                  type: string
                  description: the explanation's language
              required:
              - question
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tql:
                    type: string
                  explanation:
                    type: string
                required:
                - tql
                - explanation
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /search:
    get:
      tags:
      - Search & TQL
      summary: Search issues with TQL
      operationId: searchIssues
      description: Only issues of projects the caller can see. Errors in the query answer 400 with a message saying what's
        wrong.
      parameters:
      - name: q
        in: query
        required: false
        description: a TQL query (see the description at the top); empty matches every issue the caller can see
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: at most this many results (default 100, at most 1000)
        schema:
          type: integer
          minimum: 1
          default: 100
          maximum: 1000
      - name: offset
        in: query
        required: false
        description: skip this many results (paging)
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: project
        in: query
        required: false
        description: limit the search to this project (key or id)
        schema:
          type: string
      - name: subprojects
        in: query
        required: false
        description: 'with project: the projects below it too'
        schema:
          type: boolean
      - name: order
        in: query
        required: false
        description: 'order when the query has no `order by`: rank, created (newest first), priority (highest first) or updated
          (default, latest first)'
        schema:
          type: string
          enum:
          - rank
          - created
          - priority
          - updated
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
