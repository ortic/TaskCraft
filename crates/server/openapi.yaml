# Generated by scripts/gen-openapi.py — edit the script, not this file.
openapi: 3.1.0
info:
  title: TaskCraft API
  version: 0.1.0
  summary: Self-hosted issue and project management
  description: "Everything the TaskCraft web app does, as a REST API with JSON bodies.\n\n## Base paths\n\n`/api/v1` is the\
    \ versioned base path for integrations; the web app calls the same API under `/api`. The paths in this\ndocument are relative\
    \ to either, e.g. `GET /api/v1/issues/WEB-12`. The MCP server for AI assistants lives at `/api/mcp`\n(streamable HTTP,\
    \ not described here).\n\n## Authentication\n\n- **API token**: `Authorization: Bearer tct_…`, a personal token (*Profile\
    \ & settings → API tokens*) that acts with its\n  owner's permissions. Read-only tokens may only read (GET, plus `POST\
    \ /query/validate`); anything else answers 403.\n  API tokens, the password, sessions, two-factor and passkey changes,\
    \ the two-factor policy and the backup import are\n  managed in the browser only and refuse tokens (403).\n- **Browser\
    \ session**: the `tc_session` cookie that signing in sets. Requests that change something must also send the\n  header\
    \ `x-taskcraft: 1` (CSRF protection), else 400.\n- **Public operations** have an empty security requirement (`{}`): health\
    \ and readiness, first-run setup, the sign-in\n  flows, the service desk portal and request forms (the portal has a session\
    \ cookie of its own, `tc_portal`), the Git\n  and e-mail-in receivers (they check secrets of their own), metrics (a bearer\
    \ token of its own) and this document.\n- When the workspace requires two-factor authentication, browser sessions of people\
    \ without a second factor get 403\n  on everything but setting one up.\n\nResults are always limited to what the caller\
    \ may see; things they may not see answer 404.\n\n## Issues and rich text\n\nIssues are addressed by key (`WEB-12`; keys\
    \ an issue had before a move or a project rename keep working) or by id;\nprojects by key or id. Descriptions are ProseMirror\
    \ / Tiptap JSON (`PmNode`, a document is\n`{\"type\": \"doc\", \"content\": [...]}`); where noted, Markdown (`descriptionMarkdown`,\
    \ comments' `markdown`) or plain text\nis accepted instead. Writing an issue takes the fields of `IssueFields`; only the\
    \ fields sent change.\n\n## TQL, the query language\n\nSearch (`GET /search?q=`), CSV export, saved filters, dashboards\
    \ and automation conditions take TQL, e.g.\n`project = WEB and sprint in openSprints() and assignee = me() order by rank`\
    \ or\n`type = Bug and priority >= high and created > -14d`. Fields: `project key title text description comment type status\n\
    category priority assignee reporter creator labels sprint version affects component parent/epic points estimate spent\
    \ created\nupdated resolved resolution security due start remaining watcher voter votes blocked` and custom fields by\
    \ name (quoted when they contain spaces). Operators\n`= != ~ !~ > >= < <=`, `in (…)`, `not in`, `is [not] empty`; `and`,\
    \ `or`, `not`, parentheses; `order by`. Functions\n`me()`, `now()`, `today()`, `startOfWeek()`, `endOfWeek()`, `startOfMonth()`,\
    \ `endOfMonth()`, `openSprints()`,\n`futureSprints()`, `closedSprints()`, `releasedVersions()`, `unreleasedVersions()`,\
    \ `withSubprojects(KEY)` (`project in withSubprojects(SHOP)`); relative dates like `-7d`, `+2w`,\n`-1m`. Bare words search\
    \ titles, descriptions and the names and text of files on issues (words also match by their stem in the workspace's language).\
    \ See [TQL in the README](https://github.com/ortic/TaskCraft#features);\n`POST /query/validate` checks a query and `GET\
    \ /query/suggest` completes field names and values.\n\n## Pagination\n\n`GET /search` pages with `limit` (default 100,\
    \ at most 1,000) and `offset` and answers `{total, issues}`; other\noperations that take `limit` / `offset` say so. Everything\
    \ else answers a bounded list (e.g. the latest 60 activity\nentries, the latest 200 trashed issues), as each operation\
    \ describes.\n\n## Errors\n\nErrors answer with a status code and `{\"error\": \"<code>\", \"message\": \"<text>\"}` (schema\
    \ `Error`): 400 `bad_request`\n(invalid input; the message says what), 401 `unauthorized`, 403 `forbidden`, 404 `not_found`,\
    \ 409 `conflict`, 413\n`too_large` (uploads above `TASKCRAFT_MAX_UPLOAD_MB`), 429 `too_many_requests`, 503 `unavailable`,\
    \ 500 `internal`.\nRequests the framework refuses before they reach the API answer plain text instead: a body that isn't\
    \ valid JSON (400),\na JSON body without `Content-Type: application/json` (415), a typed body with a missing or mistyped\
    \ field (422), a\nmalformed id in the path (400) and a body above the server's overall size limit (413).\n\n## Rate limits\n\
    \nFailed sign-ins are limited to 10 per e-mail address in 15 minutes and wrong two-factor codes to 5 per sign-in; both\n\
    answer 400 with a message. The service desk portal answers 429 for sign-in links (10 requests per IP address per\nquarter\
    \ hour; at most 3 links go out per address, silently), messages from requesters (30 per hour) and request forms\n(20 per\
    \ IP address and 5 per e-mail address per hour).\n\n## Webhooks\n\nAdmins register endpoints under `/admin/webhooks` for\
    \ `issue.created`, `issue.updated`, `issue.deleted`,\n`comment.created`, `sprint.started`, `sprint.completed` and `version.released`\
    \ (all projects or one). Each delivery is\na JSON `POST` with the `WebhookEvent` body and the headers `X-TaskCraft-Event:\
    \ <event>` and\n`X-TaskCraft-Signature: sha256=<hex>`, the HMAC-SHA256 of the raw body with the webhook's secret (shown\
    \ once, when the\nwebhook is created); compare it in constant time. A delivery counts when the endpoint answers 2xx within\
    \ 10 seconds;\nothers are retried up to 7 times with growing pauses (30 seconds, 2 minutes, 8 minutes, … at most 4 hours;\
    \ about 11 hours in all).\n\n## Live updates\n\n`GET /events` is a Server-Sent Events stream of changes in the caller's\
    \ projects (`LiveEvent`); refetch what an event\ntouches."
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
servers:
- url: /api/v1
  description: versioned base path for integrations
- url: /api
  description: the same API, as the web app calls it
security:
- token: []
- session: []
tags:
- name: Assets
  description: 'The asset inventory: sets with their own permissions, asset types with fields, categories, assets with owners
    and relations, the issues about them, CSV import and export, and rules.'
- name: Auth & account
  description: First-run setup, signing in and out with a password, invitation and password-reset links, the signed-in person
    and their API tokens.
- name: Security
  description: Two-factor authentication (authenticator app and recovery codes), passkeys, the second step of a sign-in, sessions
    and the workspace's two-factor policy. Changes to sign-in methods are refused for API tokens.
- name: Sign-in
  description: 'Single sign-on providers (OpenID Connect, GitHub, LDAP, SAML): the provider list, the redirect flows and how
    the signed-in person signs in.'
- name: People & teams
  description: The people directory, user administration and teams.
- name: Projects
  description: 'Projects: list, create, read (with their whole configuration), change, archive, delete, star, members and
    roles.'
- name: Project configuration
  description: Statuses, transitions, issue types, versions (releases), components, custom fields, automation rules and labels.
- name: Boards & sprints
  description: Boards, the backlog and sprints (start, complete, burndown).
- name: Issues
  description: 'Issues: create, read, change, move on boards and backlogs, move to another project, delete and restore, clone,
    bulk changes, links, web links, watchers, history and your own work.'
- name: Comments & time
  description: Comments (with reactions and comments for the requester), time logs, time categories, the weekly timesheet
    and the time report.
- name: Attachments
  description: 'Files on issues: upload, download, delete.'
- name: Search & TQL
  description: Issue search with TQL (the query language), CSV export, quick search, query checking and completion, and the
    activity stream.
- name: Dashboards & reports
  description: Dashboards, grouped counts, the portfolio and the project reports replayed from the issues' history.
- name: Templates & service levels
  description: Issue templates (also recurring ones) and the service-level queue.
- name: Import
  description: CSV import of issues into a project, with a dry run.
- name: Integrations (WikiCraft, Git)
  description: WikiCraft (linked pages, project docs, generated pages) and Git (connected repositories, webhook receivers,
    development links).
- name: E-mail in
  description: Messages handed over by mail servers and a project's e-mail settings.
- name: Service desk portal
  description: The portal for requesters (signed in by e-mailed links, a cookie of its own), public request forms and a project's
    service desk settings.
- name: Sharing
  description: 'Share links: read-only pages of a project (a list of issues or the roadmap) for people without an account,
    and the public endpoints those pages read.'
- name: Notifications & views
  description: In-app notifications and saved filters (views).
- name: Administration
  description: Workspace settings, audit log, statistics and outgoing e-mail.
- name: Webhooks
  description: 'Outgoing webhooks: register endpoints and test them. Deliveries carry the WebhookEvent schema.'
- name: Backup import
  description: 'Migration from another tracker''s XML site backup: upload, check, import in the background.'
- name: Operations
  description: Health, readiness, Prometheus metrics, live updates and this document.
paths:
  /asset-sets:
    get:
      tags:
      - Assets
      summary: The asset sets the caller sees, with their types and categories
      operationId: listAssetSets
      description: 'When the workspace uses the asset inventory (400 otherwise). '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  canCreate:
                    type: boolean
                  sets:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssetSet'
                required:
                - canCreate
                - sets
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Assets
      summary: Add an asset set (workspace admins)
      operationId: createAssetSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                defaultRole:
                  type: string
                  enum:
                  - none
                  - viewer
                  - editor
              required:
              - name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                - id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /asset-sets/{id}:
    patch:
      tags:
      - Assets
      summary: Change a set or who has which role in it (the set's admins)
      operationId: updateAssetSet
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type:
                  - string
                  - 'null'
                defaultRole:
                  type: string
                  enum:
                  - none
                  - viewer
                  - editor
                members:
                  type: array
                  items:
                    type: object
                    properties:
                      subjectType:
                        type: string
                        enum:
                        - user
                        - team
                      subjectId:
                        type: string
                        format: uuid
                      role:
                        type: string
                        enum:
                        - viewer
                        - editor
                        - admin
                    required:
                    - subjectType
                    - subjectId
                    - role
                  description: replaces the grants
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Assets
      summary: Delete a set with everything in it (workspace admins)
      operationId: deleteAssetSet
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /asset-sets/{id}/types:
    post:
      tags:
      - Assets
      summary: Add an asset type (the set's admins)
      operationId: createAssetType
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                icon:
                  type: string
                color:
                  type: string
                tagPrefix:
                  type: string
                  description: '1 to 8 letters and digits (default: from the name)'
                fields:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: kept across changes, so values stay with their field
                      name:
                        type: string
                      kind:
                        type: string
                        enum:
                        - text
                        - number
                        - date
                        - select
                        - checkbox
                        - url
                        - user
                        - asset
                        description: 'asset: a reference to another asset'
                      options:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                          required:
                          - label
                        description: select
                      typeId:
                        type: string
                        format: uuid
                        description: 'asset: only assets of this type'
                      required:
                        type: boolean
                    required:
                    - name
                    - kind
              required:
              - name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                - id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /asset-types/{id}:
    patch:
      tags:
      - Assets
      summary: Change an asset type (the set's admins)
      operationId: updateAssetType
      description: Send every field with its id to keep values; a field left out goes with its values.
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                icon:
                  type:
                  - string
                  - 'null'
                color:
                  type:
                  - string
                  - 'null'
                tagPrefix:
                  type: string
                fields:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: kept across changes, so values stay with their field
                      name:
                        type: string
                      kind:
                        type: string
                        enum:
                        - text
                        - number
                        - date
                        - select
                        - checkbox
                        - url
                        - user
                        - asset
                        description: 'asset: a reference to another asset'
                      options:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                          required:
                          - label
                        description: select
                      typeId:
                        type: string
                        format: uuid
                        description: 'asset: only assets of this type'
                      required:
                        type: boolean
                    required:
                    - name
                    - kind
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Assets
      summary: Delete an asset type without assets (the set's admins)
      operationId: deleteAssetType
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /asset-sets/{id}/categories:
    post:
      tags:
      - Assets
      summary: Add a category (the set's admins)
      operationId: createAssetCategory
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                parentId:
                  type:
                  - string
                  - 'null'
                  format: uuid
              required:
              - name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                required:
                - id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /asset-categories/{id}:
    delete:
      tags:
      - Assets
      summary: Delete a category with the ones below it (the set's admins)
      operationId: deleteAssetCategory
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /assets:
    get:
      tags:
      - Assets
      summary: Assets the caller sees
      operationId: listAssets
      parameters:
      - name: set
        in: query
        required: false
        description: a set
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: false
        description: a type
        schema:
          type: string
          format: uuid
      - name: category
        in: query
        required: false
        description: a category, with the ones below it
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        description: in_use, in_stock, maintenance or retired
        schema:
          type: string
      - name: owner
        in: query
        required: false
        description: a person's id, or me
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: text in the tag, the name or a field
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: default 200, at most 1000
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssetSummary'
                  more:
                    type: boolean
                required:
                - assets
                - more
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Assets
      summary: Add an asset (the set's editors)
      operationId: createAsset
      description: The set's rules for new assets run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                typeId:
                  type: string
                  format: uuid
                name:
                  type: string
                tag:
                  type: string
                  description: 'default: the type''s prefix and next number'
                status:
                  type: string
                  enum:
                  - in_use
                  - in_stock
                  - maintenance
                  - retired
                categoryId:
                  type: string
                  description: 'a category''s id or name; null: none'
                ownerId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: a person
                ownerTeamId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: a team
                ownerEmail:
                  type:
                  - string
                  - 'null'
                  description: someone without an account (a requester)
                values:
                  type: object
                  additionalProperties: true
                  description: field id or name → value; select options by id or label, people by id, name or address, assets
                    by id or tag; null clears
              required:
              - typeId
              - name
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  tag:
                    type: string
                required:
                - id
                - tag
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /assets/{id}:
    get:
      tags:
      - Assets
      summary: An asset with its fields, relations, issues and history
      operationId: getAsset
      parameters:
      - name: id
        in: path
        required: true
        description: the asset's id or its tag
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AssetSummary'
                - type: object
                  properties:
                    fields:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          kind:
                            type: string
                          value:
                            description: any JSON value
                          label:
                            type:
                            - string
                            - 'null'
                            description: what a select option, person or asset is called
                        required:
                        - id
                        - name
                        - kind
                    role:
                      type: string
                      enum:
                      - viewer
                      - editor
                      - admin
                    relations:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          kind:
                            type: string
                            enum:
                            - depends_on
                            - installed_in
                          outward:
                            type: boolean
                            description: 'true: this asset depends on / is installed in the other; false: the other way round'
                          asset:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              tag:
                                type: string
                              name:
                                type: string
                              status:
                                type: string
                            required:
                            - id
                            - tag
                            - name
                        required:
                        - id
                        - kind
                        - outward
                        - asset
                    issues:
                      type: array
                      items:
                        $ref: '#/components/schemas/IssueSummary'
                      description: the issues about it that the caller sees
                    history:
                      type: array
                      items:
                        type: object
                        properties:
                          at:
                            type: string
                            format: date-time
                          actor:
                            type:
                            - string
                            - 'null'
                          kind:
                            type: string
                            enum:
                            - created
                            - changed
                            - related
                            - unrelated
                            - issue
                          data:
                            description: any JSON value
                        required:
                        - at
                        - kind
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Assets
      summary: Change an asset (the set's editors)
      operationId: updateAsset
