              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShareLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Sharing
      summary: Make a share link
      operationId: createShareLink
      description: Project admins; the workspace can turn sharing off (400 then). The query must parse (400).
      parameters:
      - name: key
        in: path
        required: true
        description: project key (former keys keep working) or project id
        schema:
