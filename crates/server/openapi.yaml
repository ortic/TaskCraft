      summary: SAML service-provider metadata (feature saml)
      operationId: getSamlMetadata
      description: Exists only in builds with the cargo feature `saml`. The metadata to register TaskCraft at the identity
        provider (entity id, assertion consumer service).
      parameters:
      - name: id
        in: path
        required: true
        description: sign-in provider id from the configuration
        schema:
          type: string
      responses:
        '200':
          description: SP metadata (XML)
          content:
            application/samlmetadata+xml:
              schema:
                type: string
        '404':
          description: Not a SAML provider (empty body)
      security:
      - {}
      x-feature: saml
