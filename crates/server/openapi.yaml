      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - issues
                  - roadmap
                  description: when making one (default issues)
                title:
                  type: string
                query:
                  type: string
                  description: TQL within the project
                people:
                  type: boolean
                comments:
                  type: boolean
                password:
                  type: string
