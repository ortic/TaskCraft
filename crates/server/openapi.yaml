      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: your password; not needed within 15 minutes of signing in
              description: Confirms a change to sign-in methods.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  publicKey:
                    type: object
                    properties:
                      rp:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            description: base64url
                          name:
                            type: string
                          displayName:
                            type: string
                      challenge:
                        type: string
                        description: base64url
                      pubKeyCredParams:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                            alg:
                              type: integer
                      timeout:
                        type: integer
                      excludeCredentials:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                            id:
                              type: string
                              description: base64url
                            transports:
                              type: array
                              items:
                                type: string
