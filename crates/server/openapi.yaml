      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  formUrl:
                    type: string
                    format: uri
                  portalUrl:
                    type: string
                    format: uri
                  mail:
                    type: boolean
                  settings:
                    $ref: '#/components/schemas/PortalSettings'
                required:
                - formUrl
                - portalUrl
                - mail
                - settings
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
