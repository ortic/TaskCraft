      operationId: listSignInProviders
      description: 'What the login page shows: a button per redirect provider; LDAP accounts use the password form.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  passwordLogin:
                    type: boolean
                    description: local passwords sign in (TASKCRAFT_DISABLE_PASSWORD_LOGIN not set)
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/SignInProvider'
                required:
                - passwordLogin
                - providers
