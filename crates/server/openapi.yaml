      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  description: 'a link type''s key (read from this issue: this issue → target), or how the link reads from
                    this issue: blocks, is blocked by, relates to, duplicates, is duplicated by, clones, or the workspace''s
                    own names (is caused by); also blockedBy, duplicatedBy. 400 lists the types for an unknown one'
