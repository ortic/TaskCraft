                type: string
            assigneeId:
              type: string
              format: uuid
            storyPoints:
              type: number
            estimateMinutes:
              type: number
            parentId:
              type: string
              format: uuid
            componentId:
              type: string
              format: uuid
            versionId:
              type: string
              format: uuid
            componentIds:
              type: array
              items:
                type: string
                format: uuid
            versionIds:
              type: array
              items:
                type: string
                format: uuid
            affectedVersionIds:
              type: array
              items:
                type: string
                format: uuid
            dueInDays:
              type: integer
              description: due this many days after the issue is created (0–3650)
            sprint:
              type: string
              enum:
              - active
              description: put it into the running sprint (if there is one)
            custom:
              type: object
              additionalProperties: true
