  /projects/{key}/reports/{report}:
    get:
      tags:
      - Dashboards & reports
      summary: A project report
      operationId: getProjectReport
      description: 'Computed from the issues'' history. The shape depends on `report`: overview (OverviewReport), velocity
        (VelocityReport), cumulative-flow (CumulativeFlowReport), cycle-time (CycleTimeReport), created-resolved (CreatedResolvedReport),
        workload (WorkloadReport).'
      parameters:
      - name: key
        in: path
        required: true
        description: project key (former keys keep working) or project id
        schema:
          type: string
      - name: report
        in: path
        required: true
        description: which report
        schema:
          type: string
          enum:
          - overview
          - velocity
          - cumulative-flow
          - cycle-time
          - created-resolved
          - workload
      - name: days
        in: query
        required: false
        description: 'cumulative-flow, created-resolved: days back (default 30, 7–365); cycle-time: issues finished in the
          last N days (default 90, 7–730)'
        schema:
          type: integer
      - name: count
        in: query
        required: false
        description: 'velocity: how many completed sprints (default 8, 1–24)'
        schema:
          type: integer
      - name: subprojects
        in: query
        required: false
        description: 'overview, cycle-time, created-resolved, workload: the projects below it too (those the caller sees)'
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/OverviewReport'
                - $ref: '#/components/schemas/VelocityReport'
                - $ref: '#/components/schemas/CumulativeFlowReport'
                - $ref: '#/components/schemas/CycleTimeReport'
                - $ref: '#/components/schemas/CreatedResolvedReport'
                - $ref: '#/components/schemas/WorkloadReport'
                description: depends on the report
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
