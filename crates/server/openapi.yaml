          format: uuid
        actor:
          anyOf:
          - $ref: '#/components/schemas/Named'
          - type: 'null'
          description: 'who caused it (null: the system, automation or a requester)'
        kind:
          type: string
          enum:
          - assigned
          - status
          - mentioned
          - commented
          - sla
          - automation
          - approval
          - approvalResult
        data:
          type: object
          properties:
            key:
              type: string
              description: the issue's key
            title:
              type: string
              description: the issue's title
            from:
              type: string
              description: 'status: previous status'
            to:
              type: string
              description: 'status: new status'
            category:
              type: string
              description: 'status: new status category'
            commentId:
              type:
              - string
              - 'null'
              format: uuid
              description: mentioned, commented
            excerpt:
              type: string
              description: 'commented: the start of the comment'
            by:
              type: string
              description: a requester without an account who did it
            goal:
              type: string
              description: 'sla: response or resolution'
            targetMinutes:
              type: integer
              description: 'sla: the missed goal'
            message:
              type: string
              description: 'automation: the rule''s message'
          required:
          - key
          - title
          additionalProperties: true
          description: details by kind
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
      required:
      - id
      - actor
      - kind
      - data
      - createdAt
      - read
    WikiPage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: the page's id in WikiCraft
        title:
          type: string
        spaceKey:
          type: string
        spaceName:
          type: string
          description: empty for a page just created
        url:
          type: string
          format: uri
          description: <WikiCraft>/pages/<id>
        updatedAt:
          type:
          - string
          - 'null'
          description: when it last changed (as WikiCraft reports it)
        excerpt:
          type:
          - string
          - 'null'
          description: 'search results: the matching text'
      required:
      - id
      - title
      - spaceKey
      - spaceName
      - url
      description: A WikiCraft page as TaskCraft shows it (looked up live with the person's own WikiCraft token, else the
        installation's).
    WikiSpace:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
      required:
      - key
      - name
      - url
      description: A WikiCraft space (archived ones left out).
    NewWikiPage:
      type: object
      properties:
        spaceKey:
          type: string
          description: 'the space to write it in (default: the project''s wiki space from its settings, `wikiSpace`)'
        title:
          type: string
          description: 'default: a title made from the issue, sprint or version'
        parentId:
          type: string
          format: uuid
          description: 'the page to put it under (default: the project''s `wikiParentPage` setting)'
      description: Where a generated page goes; every field is optional.
    GitIntegration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - github
          - gitlab
          - generic
        repoUrl:
          type: string
          format: uri
          description: the repository's web address (without .git)
        repo:
          type: string
          description: owner/name, for display
        webhookUrl:
          type: string
          format: uri
          description: where the Git server sends its webhooks (POST /integrations/git/{provider}/{secret})
        createdAt:
          type: string
          format: date-time
        deliveries:
          type: integer
          description: webhook deliveries received
        lastEvent:
          type:
          - string
          - 'null'
          description: the last delivery's event (push, pull_request, Push Hook, generic, rejected, …)
        lastEventAt:
          type:
          - string
          - 'null'
          format: date-time
        lastError:
          type:
          - string
          - 'null'
          description: what went wrong with the last delivery
        secret:
          type: string
          description: 'only in the answers that create it (connecting, a new secret): the webhook secret, shown once'
        api:
          type:
          - object
          - 'null'
          properties:
            kind:
              type: string
              enum:
              - github
              - gitlab
              - gitea
            url:
              type:
              - string
              - 'null'
              description: the API's address when it isn't the usual one
            defaultBranch:
              type:
              - string
              - 'null'
          required:
          - kind
          description: 'the server''s API is connected: branches and draft pull requests can be created from issues (the token
            is never shown)'
      required:
      - id
      - provider
      - repoUrl
      - repo
      - webhookUrl
      - createdAt
      - deliveries
      description: A repository connected to a project.
    GitRules:
      type: object
      properties:
        mergedStatusId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'when a pull request is merged, move its issues to this status (null: off)'
        openedStatusId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'when a branch is pushed or a pull request opened, move its issues to this status (null: off)'
      description: A project's Git rules. Issues only move forward in the workflow and, in restricted workflows, only along
        allowed transitions.
    GitPush:
      type: object
      properties:
        commits:
          type: array
          items:
            type: object
            properties:
              sha:
                type: string
                description: commit id (also accepted as `id`)
              message:
                type: string
              url:
                type: string
                format: uri
                description: 'default: <repository>/commit/<sha>'
              author:
                type: string
              timestamp:
                type: string
                description: RFC 3339
            required:
            - sha
          description: at most 200 are read
        branch:
          oneOf:
          - type: object
            properties:
              name:
                type: string
              url:
                type: string
                format: uri
                description: 'default: <repository>/tree/<name>'
              author:
                type: string
            required:
            - name
          - type: string
            description: just the branch name
          description: a pushed branch
        pullRequest:
          type: object
          properties:
            number:
              type: integer
            title:
              type: string
            body:
              type: string
            url:
              type: string
              format: uri
            state:
              type: string
              description: open (default), merged or closed (declined / rejected count as closed)
            author:
              type: string
            branch:
              type: string
              description: source branch
            updatedAt:
              type: string
              description: RFC 3339 (also accepted as `timestamp`)
          required:
          - url
          description: a pull / merge request (also accepted as `pull_request`)
      description: The generic delivery format for Git servers without a built-in format (provider `generic`); every part
        is optional. Issue keys are found in commit messages, branch names, pull request titles, descriptions and source branches.
    DevelopmentLink:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - commit
          - branch
          - pull_request
        title:
          type: string
          description: commit message, branch name or pull request title
        url:
          type: string
          format: uri
        author:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
          enum:
          - open
          - merged
          - closed
          - null
          description: 'pull requests: their state'
        sha:
          type:
          - string
          - 'null'
          description: commits
        branch:
          type:
          - string
          - 'null'
        number:
          type:
          - integer
          - 'null'
          description: 'pull requests: their number'
        repo:
          type:
          - string
          - 'null'
          description: owner/name
        at:
          type: string
          format: date-time
        draft:
          type:
          - boolean
          - 'null'
          description: 'pull requests: not ready for review yet'
        checks:
          type:
          - string
          - 'null'
          enum:
          - pending
          - success
          - failure
          - null
          description: 'pull requests: checks / CI as the Git server last reported'
        review:
          type:
          - string
          - 'null'
          enum:
          - approved
          - changes_requested
          - null
          description: 'pull requests: where the reviews stand'
        reviewers:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              name:
                type: string
              state:
                type: string
                enum:
                - requested
                - approved
                - changes_requested
            required:
            - name
            - state
          description: 'pull requests: who was asked and what they said'
      required:
      - id
      - kind
      - title
      - url
      - at
      description: A commit, branch or pull request linked to an issue by the Git integration.
    MailInResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - created
          - commented
          - ignored
          - rejected
          - duplicate
          description: what became of the message
        reason:
          type: string
          description: 'ignored / rejected / duplicate: why — auto-reply, bulk, bounce, loop, empty, too-large, no-sender,
            forged, rate-limit, no-project, not-allowed, archived, invalid, unreadable, failing, duplicate'
        detail:
          type: string
          description: more about it (e.g. the addresses no project takes, notes about skipped files)
        issue:
          type: string
          description: 'created / commented: the issue''s key'
      required:
      - status
      description: What became of a message handed over to e-mail in.
    MailInSettings:
      type: object
      properties:
        enabled:
          type: boolean
          description: the project takes e-mail
        address:
          type: string
          format: email
          description: its own address (lower case); mail to `+KEY` addresses of the mailbox works without one
        senders:
          type: string
          enum:
          - members
          - anyone
          description: 'members: people with an account and access to the project; anyone: unknown senders become requesters'
      required:
      - enabled
      - senders
      description: A project's e-mail settings.
    MailInMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
        source:
          type: string
          enum:
          - imap
          - http
          description: read from the mailbox, or handed over by a mail server
        from:
          type: string
        fromName:
          type:
          - string
          - 'null'
        to:
          type:
          - string
          - 'null'
          description: the project address it came in at
        subject:
          type: string
        status:
          type: string
          enum:
          - processing
          - created
          - commented
          - ignored
          - rejected
          - duplicate
          - failed
        reason:
          type:
          - string
          - 'null'
          description: see MailInResult
        detail:
          type:
          - string
          - 'null'
        issueKey:
          type:
          - string
          - 'null'
          description: the issue it created or commented on
        routed:
          type: boolean
          description: it reached a project (workspace admins also see messages that reached none)
      required:
      - id
      - receivedAt
      - source
      - from
      - subject
      - status
      - routed
      description: A received message in the e-mail log (kept 90 days).
    MailInOverview:
      type: object
      properties:
        settings:
          $ref: '#/components/schemas/MailInSettings'
        imap:
          type:
          - object
          - 'null'
          properties:
            mailbox:
              type: string
              description: user@host:port/mailbox (security), no password
            checkedAt:
              type:
              - string
              - 'null'
              format: date-time
              description: last time it was read
            okAt:
              type:
              - string
              - 'null'
              format: date-time
              description: last time reading it worked
            error:
              type:
              - string
              - 'null'
              description: why the last read failed
          description: the mailbox TaskCraft reads (TASKCRAFT_IMAP_URL), null when none is set up
        http:
          type: boolean
          description: mail servers can hand messages over (TASKCRAFT_MAIL_IN_TOKEN is set)
        endpoint:
          type: string
          format: uri
          description: the address mail servers post messages to
        smtp:
          type: boolean
          description: outgoing e-mail works (acknowledgements, replies to requesters)
        plusAddress:
          type:
          - string
          - 'null'
          description: the mailbox's +KEY address for this project, when the mailbox's user name is an e-mail address
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MailInMessage'
          description: the latest 50 messages
      required:
      - settings
      - imap
      - http
      - endpoint
      - smtp
      - plusAddress
      - messages
      description: A project's e-mail settings, how this server receives mail and the latest messages.
    PortalRequest:
      type: object
      properties:
        key:
          type: string
          description: the issue key
        title:
          type: string
        project:
          type: string
          description: the project's name
        state:
          type: string
          enum:
          - open
          - in_progress
          - resolved
          description: the status in plain words
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: the last change the requester can see (status, a comment for them)
        resolvedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - key
      - title
      - project
      - state
      - createdAt
      - updatedAt
      description: A request as its requester sees it in the portal.
    PortalMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mine:
          type: boolean
          description: written by the requester
        author:
          type:
          - string
          - 'null'
          description: the team member's name (null for the requester's own)
        body:
          $ref: '#/components/schemas/PmNode'
          description: the text, with mentions and issue references as plain text and no images
        createdAt:
          type: string
          format: date-time
        edited:
          type: boolean
      required:
      - id
      - mine
      - body
      - createdAt
      - edited
      description: 'A message of the conversation: the requester''s own and the comments marked visible to the requester (never
        internal ones).'
    PortalFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mime:
          type: string
        size:
          type: integer
          description: bytes
        createdAt:
          type: string
          format: date-time
        url:
          type: string
          description: /api/portal/attachments/{id}
      required:
      - id
      - name
      - mime
      - size
      - createdAt
      - url
      description: A file the requester added.
    PortalRequestDetail:
      description: A request with its description, conversation and the requester's files.
      allOf:
      - $ref: '#/components/schemas/PortalRequest'
      - type: object
        properties:
          description:
            anyOf:
            - $ref: '#/components/schemas/PmNode'
            - type: 'null'
            description: as the requester sees it (mentions as plain text, no images)
          messages:
            type: array
            items:
              $ref: '#/components/schemas/PortalMessage'
          files:
            type: array
            items:
              $ref: '#/components/schemas/PortalFile'
          canReply:
            type: boolean
            description: the project isn't archived
          canResolve:
            type: boolean
            description: the project lets requesters mark requests resolved, and it isn't resolved yet
          approval:
            type:
            - object
            - 'null'
            properties:
              id:
                type: string
                format: uuid
              step:
                type: string
            required:
            - id
            - step
            description: the decision the visitor is asked for (POST …/approval)
          limits:
            type: object
            properties:
              files:
                type: integer
                description: files per message
              mb:
                type: integer
                description: MB of files per message, together
              text:
                type: integer
                description: characters per message
            required:
            - files
            - mb
            - text
        required:
        - description
        - messages
        - files
        - canReply
        - canResolve
        - limits
    RequestFormSettings:
      type: object
      properties:
        enabled:
          type: boolean
          description: the form is published
        slug:
          type: string
          description: 'its address instead of the project key (/portal/forms/<slug>): 2–40 letters a–z, digits and dashes,
            unique'
        suggestSpace:
          type:
          - string
          - 'null'
          description: a WikiCraft space whose pages are suggested while requesters type the summary (one they can read without
            signing in)
        listed:
          type: boolean
          description: shown on the portal's start page (default true)
        title:
          type: string
          description: 'up to 200 characters (empty: the portal''s own)'
        intro:
          type: string
          description: shown above the fields, plain text, up to 5,000 characters
        success:
          type: string
          description: shown after sending, up to 2,000 characters
        description:
          type: string
          enum:
          - 'off'
          - optional
          - required
          description: whether the form asks for it, and whether it must be filled
        name:
          type: string
          enum:
          - 'off'
          - optional
          - required
          description: whether the form asks for it, and whether it must be filled
        types:
          type: array
          items:
            type: string
            format: uuid
          description: 'standard issue types to choose from (none or one: no choice)'
        typeId:
          type: string
          format: uuid
          description: the type when there's no choice (else the project's first)
        priority:
          type: boolean
          description: ask for a priority (low, medium, high, urgent)
        custom:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: a custom field of the project (not a people field)
              required:
                type: boolean
            required:
            - id
          description: custom fields, in order
      description: A project's public request form. Texts left empty show the portal's own (translated) ones.
    PortalSettings:
      type: object
      properties:
        resolve:
          type: boolean
          description: requesters may mark their requests resolved
        resolveStatus:
          type: string
          format: uuid
          description: 'the done status resolved requests move to (default: the first done status)'
        form:
          $ref: '#/components/schemas/RequestFormSettings'
      description: A project's service desk settings.
    RequestForm:
      type: object
      properties:
        path:
          type: string
          description: 'where the form lives: its slug, else the project key in lower case'
        project:
          type: string
          description: the project's name
        title:
          type: string
        intro:
          type: string
        success:
          type: string
          description: the message after sending
        description:
          type: string
          enum:
          - 'off'
          - optional
          - required
          description: whether the form asks for it, and whether it must be filled
        name:
          type: string
          enum:
          - 'off'
          - optional
          - required
          description: whether the form asks for it, and whether it must be filled
        types:
          type: array
          items:
            $ref: '#/components/schemas/Named'
          description: issue types to choose from (only when there are several)
        priority:
          type: boolean
          description: the form asks for a priority
        suggest:
          type: boolean
          description: articles are suggested while the summary is typed (see suggestArticles)
        fields:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              kind:
                type: string
                enum:
                - text
                - number
                - select
                - multiselect
                - date
                - checkbox
                - url
              description:
                type:
                - string
                - 'null'
              required:
                type: boolean
              options:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                  required:
                  - id
                  - label
                description: select / multiselect choices
            required:
            - id
            - name
            - kind
            - required
            - options
        stamp:
          type: string
          description: 'a signed time stamp of when the form was opened: send it back with the submission (valid for a day)'
        minSeconds:
          type: integer
          description: submissions sooner than this after opening are refused
      required:
      - path
      - project
      - title
      - intro
      - success
      - description
      - name
      - types
      - priority
      - fields
      - stamp
      - minSeconds
      description: A public request form.
    RequestSubmission:
      type: object
      properties:
        stamp:
          type: string
          description: the form's `stamp`
        email:
          type: string
          format: email
          description: 'the sender''s address (ignored for requesters signed in to the portal: theirs is used)'
        name:
          type: string
          description: up to 100 characters, when the form asks for it
        summary:
          type: string
          description: 'the request''s title: required, up to 200 characters'
        description:
          type: string
          description: plain text, up to 20,000 characters, when the form asks for it
        typeId:
          type: string
          description: one of the form's types, when it offers several
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - urgent
          description: when the form asks for one
        custom:
          type: object
          additionalProperties:
            description: any JSON value
          description: values of the form's custom fields by field id (as for issues; each up to 4,000 characters)
        website:
          type: string
          description: 'a hidden field people never see: leave it empty (submissions that fill it are answered as if they
            worked, and dropped)'
      required:
      - stamp
      - summary
      description: A request form submission.
    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'only this project''s events (null: all projects)'
        projectKey:
          type:
          - string
          - 'null'
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
          description: 'the events it gets (empty or `*`: all)'
        active:
          type: boolean
        lastStatus:
          type:
          - integer
          - 'null'
          description: HTTP status of the last delivery
        lastError:
          type:
          - string
          - 'null'
        lastSentAt:
          type:
          - string
          - 'null'
          format: date-time
        format:
          type: string
          enum:
          - json
          - slack
          - teams
          - google-chat
          description: 'json (default): the signed event (WebhookEvent); slack (also Mattermost and other Slack-compatible
