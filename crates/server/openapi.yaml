                kind:
                  type: string
                  enum:
                  - github
                  - gitlab
                  - gitea
                  description: 'default: by the webhook''s provider; gitea also for Forgejo'
                url:
                  type: string
                  description: the API's address when it can't be told from the repository's (e.g. https://host/gitlab/api/v4)
              required:
