  /issues/{key}/branch:
    post:
      tags:
      - Integrations (WikiCraft, Git)
      summary: Create a branch for the issue on the Git server
      operationId: createIssueBranch
      description: 'Project members, as the project''s `createBranches` permission says. The branch is created through the
        server''s API from `base` and linked to the issue at once (the project''s rule for started work applies); with `pullRequest`
        a draft pull / merge request is opened too — on GitHub that takes an empty first commit on the branch. When the server
        refuses the pull request the branch stays and `warning` says why. 409: the branch exists already.'
      parameters:
      - name: key
        in: path
        required: true
        description: issue key (e.g. WEB-12; former keys keep working) or issue id
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                integrationId:
                  type: string
                  format: uuid
                  description: which repository, when several are connected
                name:
                  type: string
                  description: 'default: the suggested name'
                base:
                  type: string
                  description: 'default: the repository''s default branch'
                pullRequest:
                  type: boolean
                  description: also open a draft pull request
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  branch:
                    type: object
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                        format: uri
                      base:
                        type: string
                    required:
                    - name
                    - url
                    - base
                  pullRequest:
                    type: object
                    properties:
                      number:
                        type:
                        - integer
                        - 'null'
                      url:
                        type: string
                        format: uri
                    required:
                    - url
                  warning:
                    type: string
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/DevelopmentLink'
                required:
                - branch
                - links
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /git-integrations/{id}/api:
    put:
