  /time-report:
    get:
      tags:
      - Comments & time
      summary: Time logged in a period, grouped
      operationId: getTimeReport
      description: Over the issues the caller sees (private ones only for those who see them). Grouped by `group` and, inside,
        by `then`; or, with `format=csv`, every log as a row (Date, Person, Project, Issue, Title, Category, Customer, Customer
        number, Billable, Hours, Minutes, Note — and Rate, Amount, Currency for workspace admins when rates are set). Time
        in a closed period (the workspace's `timeClosedUntil`) can be read but only admins change it.
      parameters:
      - name: from
        in: query
        required: false
        description: 'first day (default: the first of this month)'
        schema:
          type: string
          format: date
          description: YYYY-MM-DD
      - name: to
        in: query
        required: false
        description: 'last day (default: today; at most two years after from)'
        schema:
          type: string
          format: date
          description: YYYY-MM-DD
      - name: group
        in: query
        required: false
        description: person (default), project, issue, category, customer, day, week or month
        schema:
          type: string
      - name: then
        in: query
        required: false
        description: a second grouping inside the first (same choices), or none
        schema:
          type: string
      - name: projects
        in: query
        required: false
        description: 'project keys, comma separated (default: all the caller sees)'
        schema:
          type: string
      - name: subprojects
        in: query
        required: false
        description: 'with projects: the projects below them too'
        schema:
          type: boolean
      - name: user
        in: query
        required: false
        description: only this person's time
        schema:
          type: string
          format: uuid
      - name: category
        in: query
        required: false
        description: a time category's id, or none
        schema:
          type: string
      - name: billable
        in: query
        required: false
        description: only billable (true) or not billable (false) time
        schema:
          type: boolean
      - name: customer
        in: query
        required: false
        description: a customer's id (the log's own, else its project's), or none
        schema:
          type: string
      - name: format
        in: query
        required: false
        description: csv for a download of every log
        schema:
          type: string
      responses:
        '200':
          description: The report (CSV with format=csv)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeReport'
