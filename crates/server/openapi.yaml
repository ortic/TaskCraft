      operationId: receiveGitWebhook
      description: 'The address comes from connecting a repository (`webhookUrl`). GitHub (also Gitea, Forgejo): `push` and
        `pull_request` events, signed with X-Hub-Signature-256. GitLab: Push and Merge request events with X-Gitlab-Token.
        generic: the GitPush format with X-TaskCraft-Token (or `Authorization: Bearer <secret>`) or X-Hub-Signature-256. Issue
        keys of the repository''s project (also former keys) become development links; the project''s Git rules may move the
        issues. Events with nothing to link (ping, tags, deleted branches, others) are answered with `ignored`.'
      parameters:
      - name: provider
        in: path
        required: true
        description: the kind of Git server
        schema:
          type: string
          enum:
          - github
          - gitlab
          - generic
      - name: secret
        in: path
        required: true
        description: the integration's address key (a random value in its webhook address, replaced with each new secret)
        schema:
          type: string
      - name: X-Hub-Signature-256
        in: header
        required: false
        description: 'github (and optionally generic): `sha256=<hex HMAC-SHA256 of the raw body with the secret>`'
        schema:
          type: string
      - name: X-Gitlab-Token
        in: header
        required: false
        description: 'gitlab: the secret'
        schema:
          type: string
      - name: X-TaskCraft-Token
        in: header
        required: false
        description: 'generic: the secret'
        schema:
          type: string
      - name: X-GitHub-Event
        in: header
        required: false
        description: 'github: the event (push, pull_request, …; X-Gitea-Event and X-Forgejo-Event work too)'
        schema:
          type: string
      - name: X-Gitlab-Event
        in: header
        required: false
        description: 'gitlab: the event (Push Hook, Merge Request Hook)'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/GitPush'
              - type: object
                additionalProperties: true
                description: a GitHub or GitLab webhook payload
      responses:
        '200':
          description: Handled
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    ok:
                      type: boolean
                    event:
                      type: string
                    issues:
                      type: array
                      items:
                        type: string
                      description: keys of issues that got a new link or a changed pull request
                    newLinks:
                      type: integer
                    moved:
                      type: array
                      items:
                        type: string
                      description: keys of issues the project's rules moved
                  required:
                  - ok
                  - event
                  - issues
                  - newLinks
                  - moved
                - type: object
                  properties:
                    ok:
                      type: boolean
                    ignored:
                      type: string
                      description: the event, which carried nothing to link
                  required:
                  - ok
                  - ignored
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - {}
  /projects/{key}/git:
