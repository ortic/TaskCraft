      operationId: askAgentModel
      description: 'For the runner, with the token of this one run (`Authorization: Bearer tcx_…`, from the claim); 409 once
        the run has ended or was cancelled. Asked by the server with its key and counted on the run (at most 300 a run).'
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                system:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                        - user
                        - assistant
                      content:
                        type: string
                    required:
                    - role
                    - content
              required:
              - messages
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                  usage:
                    type: object
                    properties:
                      input:
                        type: integer
                      output:
                        type: integer
                required:
                - text
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - {}
  /agent-runs/{id}/finish:
    post:
      tags:
      - Integrations (WikiCraft, Git)
      summary: Hand in a run's result
      operationId: finishAgentRun
      description: 'For the runner, with the token of this one run (`Authorization: Bearer tcx_…`, from the claim); 409 once
        the run has ended or was cancelled. Changed files (paths inside the repository, up to 300 files and 5 MB) become a
        branch, one commit and a draft pull request, linked to the issue and announced in a comment by the agent; without
        files the answer (or summary) becomes the comment; `error` fails the run.'
      parameters:
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
                answer:
                  type: string
                error:
                  type: string
                files:
                  type: array
                  items:
                    type: object
                    properties:
                      path:
                        type: string
                      status:
                        type: string
                        enum:
                        - added
                        - modified
                        - deleted
                      content:
                        type: string
                        description: base64; not for deleted files
                    required:
                    - path
                    - status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                  result:
                    description: any JSON value
                required:
                - state
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
      security:
      - {}
  /integrations/mail-in:
    post:
      tags:
      - E-mail in
      summary: Hand over one received e-mail
      operationId: receiveMail
      description: For mail servers and services (TASKCRAFT_MAIL_IN_TOKEN; off, 404, without one). The body is one raw RFC
        822 message, or a multipart form with the message in the field `email` (also `body-mime`, `message` or `mime`). Answers
        200 with what became of it — also when it was ignored or refused, so nothing bounces back to senders — and 503 when
        it should be sent again later. Messages over 40 MB are refused (`too-large`); at most 30 messages per sender and hour.
      requestBody:
        required: true
        content:
          message/rfc822:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: binary
                  description: the raw message (or `body-mime`, `message`, `mime`)
                body-mime:
                  type: string
                  format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: 'any other content type: the body is the message'
      responses:
        '200':
          description: What became of the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailInResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - mailInToken: []
      - mailInHeader: []
      - mailInQuery: []
