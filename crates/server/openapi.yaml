        at:
          type: string
          format: date-time
      required:
      - id
      - action
      - at
    ShareLink:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - issues
          - roadmap
        title:
          type: string
        query:
          type: string
          description: 'TQL within the project (issues; empty: all)'
        url:
          type: string
          format: uri
          description: the page's address
        people:
          type: boolean
          description: shows people's names
        comments:
          type: boolean
          description: shows comments meant for everyone
        password:
          type: boolean
          description: asks for a password
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: works until
        expired:
          type: boolean
        createdAt:
          type: string
          format: date-time
        views:
          type: integer
        lastViewedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - kind
      - title
      - url
      - password
      - createdAt
