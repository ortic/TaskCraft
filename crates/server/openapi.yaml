  /auth/sso/{id}/login:
    get:
      tags:
      - Sign-in
      summary: Start a single sign-on
      operationId: startSsoSignIn
      description: Redirects the browser to the provider (OpenID Connect with PKCE, GitHub, or SAML in builds with it) and
        binds the sign-in to this browser with a `tc_sso` cookie. Unknown providers and failures redirect to /login?error=….
      parameters:
      - name: id
        in: path
        required: true
        description: sign-in provider id from the configuration
        schema:
          type: string
      - name: next
        in: query
        required: false
        description: same-site path to return to afterwards (default /)
        schema:
          type: string
      responses:
        '303':
          description: To the identity provider, or to /login?error=…
          headers:
            Location:
              schema:
                type: string
              description: where the browser goes next
      security:
      - {}
  /auth/sso/{id}/callback:
    get:
      tags:
      - Sign-in
      summary: Single sign-on callback (OpenID Connect, GitHub)
      operationId: finishSsoSignIn
      description: The provider sends the browser back here. Creates the session (or the second step on /login?mfa=1 for people
        with a second factor) and redirects to `next`; refusals redirect to /login?error=…. Register `{TASKCRAFT_BASE_URL}/api/auth/sso/{id}/callback`
        as the redirect address at the provider.
      parameters:
      - name: id
        in: path
        required: true
        description: sign-in provider id from the configuration
        schema:
          type: string
      - name: code
        in: query
        required: false
        description: authorization code
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: the sign-in's state
        schema:
          type: string
      - name: error
        in: query
        required: false
        description: the provider's error code
        schema:
          type: string
      - name: error_description
        in: query
        required: false
        description: the provider's error text
        schema:
          type: string
      responses:
        '303':
          description: To the page the sign-in started from, /login?mfa=1, or /login?error=…
          headers:
            Location:
              schema:
                type: string
              description: where the browser goes next
      security:
      - {}
  /auth/sso/{id}/acs:
    post:
      tags:
      - Sign-in
      summary: SAML assertion consumer service (feature saml)
      operationId: samlAssertionConsumer
      description: Exists only in builds with the cargo feature `saml`. The identity provider posts its signed response here
        (HTTP-POST binding, SP-initiated sign-ins only); redirects like the OpenID Connect callback.
      parameters:
      - name: id
        in: path
        required: true
        description: sign-in provider id from the configuration
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLResponse:
                  type: string
                  description: base64-encoded SAML response
                RelayState:
                  type: string
                  description: the sign-in's state
              required:
              - SAMLResponse
      responses:
        '303':
          description: To the page the sign-in started from, /login?mfa=1, or /login?error=…
          headers:
            Location:
              schema:
                type: string
              description: where the browser goes next
      security:
      - {}
      x-feature: saml
