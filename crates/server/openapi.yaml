            description: Markdown
          - $ref: '#/components/schemas/PmNode'
          - type: 'null'
          description: Markdown or ProseMirror JSON (empty = none)
        fields:
          type: object
          properties:
            typeId:
              type: string
              format: uuid
            priority:
