                          properties:
                            name:
                              type: string
                            level:
                              type: integer
                        status:
                          type: object
                          properties:
                            name:
                              type: string
                            category:
                              type: string
                            color:
                              type:
                              - string
                              - 'null'
                        priority:
                          type: string
                        assignee:
                          type:
                          - object
                          - 'null'
