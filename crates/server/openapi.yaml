  /setup:
    get:
      tags:
      - Auth & account
      summary: Whether first-run setup is needed
      operationId: getSetupStatus
      description: Also allowed while two-factor setup is required.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  needsSetup:
                    type: boolean
                    description: no workspace exists yet
                  mail:
                    type: boolean
                    description: outgoing e-mail is configured
                required:
                - needsSetup
                - mail
      security:
      - {}
    post:
      tags:
      - Auth & account
      summary: 'First-run setup: create the workspace and its owner'
      operationId: completeSetup
      description: Works once (409 afterwards). Signs the owner in. The password needs at least 8 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceName:
                  type: string
                name:
                  type: string
                  description: the owner's name
                email:
                  type: string
                  format: email
                password:
                  type: string
                  description: at least 8 characters
                demo:
                  type: boolean
                  description: fill the workspace with sample projects to explore (default false)
              required:
              - workspaceName
              - name
              - email
              - password
      responses:
        '200':
          description: Set up and signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: always true
                required:
                - ok
          headers:
            Set-Cookie:
              schema:
                type: string
              description: the session cookie `tc_session` (HttpOnly, SameSite=Lax)
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - {}
  /auth/login:
    post:
      tags:
      - Auth & account
      summary: Sign in with e-mail (or directory username) and password
      operationId: signIn
      description: 'Answers `{ok: true}` with the session cookie, or — for people with a second factor — a SecondStep without
        a session: complete it with POST /auth/mfa. Directory (LDAP) accounts sign in here too. Failed sign-ins are limited
        to 10 per e-mail address and 15 minutes (then 400). Wrong e-mail or password: 403. Password sign-in turned off (TASKCRAFT_DISABLE_PASSWORD_LOGIN
        without a directory): 400.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: e-mail address, or a directory username
                password:
                  type: string
              required:
              - email
              - password
      responses:
        '200':
          description: Signed in (session cookie set), or the second step starts
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    ok:
                      type: boolean
                      description: always true
                  required:
                  - ok
                - $ref: '#/components/schemas/SecondStep'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: the session cookie `tc_session` (HttpOnly, SameSite=Lax)
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - {}
  /auth/logout:
    post:
      tags:
      - Auth & account
      summary: Sign out
      operationId: signOut
      description: Ends the session of the cookie sent (if any) and clears the cookie.
      responses:
        '204':
          description: Done (no content)
      security:
      - {}
  /auth/link:
    get:
      tags:
      - Auth & account
      summary: What an invitation or password-reset link is for
      operationId: getLinkInfo
      description: 400 when the link expired or was already used.
      parameters:
      - name: token
        in: query
        required: true
        description: the token from the link (…/welcome?token=…)
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - invite
                    - reset
                  name:
                    type: string
                  email:
                    type:
                    - string
                    - 'null'
                  workspace:
                    type: string
                    description: workspace name
                required:
                - kind
                - name
                - workspace
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - {}
    post:
      tags:
      - Auth & account
      summary: Accept an invitation or reset the password with a link
      operationId: acceptLink
      description: 'Sets the password (at least 8 characters), activates an invited account, signs out the person''s other
        sessions and signs them in. People with a second factor get `{mfaRequired: true}` and a `tc_mfa` cookie instead: the
        sign-in continues with POST /auth/mfa (without mfaToken). Links are one-time and valid 7 days (1 hour from POST /auth/forgot).
        Not available when password sign-in is turned off.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  description: at least 8 characters
                name:
                  type: string
                  description: change the name (optional)
              required:
              - token
              - password
      responses:
        '200':
          description: Signed in, or the second step follows
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    ok:
                      type: boolean
                      description: always true
                  required:
                  - ok
                - type: object
                  properties:
                    mfaRequired:
                      type: boolean
                  required:
                  - mfaRequired
          headers:
            Set-Cookie:
              schema:
                type: string
              description: the session cookie `tc_session` (HttpOnly, SameSite=Lax)
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - {}
  /auth/forgot:
    post:
      tags:
      - Auth & account
      summary: E-mail a password-reset link
      operationId: requestPasswordReset
      description: Always answers 204, whether or not the address has an account; at most three e-mails per address and hour;
        the link works for an hour. 400 when outgoing e-mail isn't configured or password sign-in is turned off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - {}
  /me:
