          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /share/{token}:
    get:
      tags:
      - Sharing
      summary: What a shared page is
      operationId: getSharedPage
      description: 'Public: the address is the key. Unknown, ended or revoked links, and all of them while the workspace turns
        sharing off, answer 404; with a password, send the key from /unlock as x-share-key (else 401). Private issues and
        restricted comments are never shown. Counts a view.'
      parameters:
      - name: token
        in: path
        required: true
        description: the secret part of the address
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  kind:
                    type: string
                    enum:
                    - issues
                    - roadmap
                  locked:
                    type: boolean
                    description: asks for the password first
                  project:
                    type: object
                    properties:
                      name:
                        type: string
                      key:
                        type: string
                      color:
                        type:
                        - string
                        - 'null'
                  workspace:
                    type: object
                    properties:
                      name:
                        type: string
                  people:
                    type: boolean
                  comments:
                    type: boolean
                  expiresAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                required:
                - title
                - kind
                - locked
        '404':
