          additionalProperties:
            type: string
            description: key, id, title, description, type, status, priority, assignee, reporter, labels, sprint, version,
              component, parent, points, estimate, estimateSeconds, spent, spentSeconds, start, due, created, resolved, custom:<field
              id> or ignore
          description: column header → field; columns left out get the suggested field. One column must go to title
        dryRun:
