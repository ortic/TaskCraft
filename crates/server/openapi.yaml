        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                request:
                  type: string
                  description: the request (issue key) the link should lead to
              required:
              - email
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - {}
  /portal/session:
    post:
      tags:
      - Service desk portal
      summary: Sign in to the portal with a link's token
      operationId: startPortalSession
      description: The token works once. Sets the portal session cookie (`tc_portal`, 7 days, sent only to /api/portal); it
        never signs anyone in to TaskCraft itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: the token from the e-mailed link
              required:
              - token
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    format: email
                required:
                - email
          headers:
            Set-Cookie:
              schema:
                type: string
              description: the portal session (tc_portal)
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - {}
    delete:
      tags:
      - Service desk portal
      summary: Sign out of the portal
      operationId: endPortalSession
      responses:
        '204':
          description: Signed out
          headers:
            Set-Cookie:
              schema:
                type: string
              description: clears tc_portal
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - {}
      - portalSession: []
  /portal/colleagues:
    get:
      tags:
      - Service desk portal
      summary: The signed-in requester's organization and its members
      operationId: listPortalColleagues
      description: To share a request with. Needs a portal session (cookie tc_portal, from POST /portal/session); 401 without
        one.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    type:
                    - string
                    - 'null'
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          format: email
                        name:
                          type:
                          - string
                          - 'null'
                      required:
                      - email
                required:
                - organization
                - members
      security:
      - portalSession: []
  /portal/requests/{key}/share:
    put:
      tags:
      - Service desk portal
      summary: Share a request (its requester)
      operationId: sharePortalRequest
      description: '`organization`: everyone in the request''s organization follows and answers it; `emails`: only these colleagues
        (members of the organization; replaces the list). Only the requester shares; resolving stays theirs. Needs a portal
        session (cookie tc_portal, from POST /portal/session); 401 without one.'
      parameters:
      - name: key
        in: path
        required: true
        description: issue key (e.g. WEB-12; former keys keep working) or issue id
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization:
                  type: boolean
                emails:
                  type: array
                  items:
                    type: string
                    format: email
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  shared:
                    type: boolean
                  sharedWith:
                    type: array
                    items:
                      type: string
                      format: email
                required:
                - shared
                - sharedWith
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - portalSession: []
  /portal/requests:
    get:
      tags:
      - Service desk portal
      summary: The signed-in requester's requests, latest first
      operationId: listPortalRequests
      description: Requests opened for the address in every project (at most 500). Needs a portal session (cookie tc_portal,
        from POST /portal/session); 401 without one.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    format: email
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortalRequest'
                required:
                - email
                - requests
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - portalSession: []
  /portal/requests/{key}:
    get:
      tags:
      - Service desk portal
      summary: A request as its requester sees it
      operationId: getPortalRequest
      description: The description, the conversation (their own messages and the comments marked for them, never internal
        ones) and their files. Requests of other addresses answer 404 like ones that don't exist. Needs a portal session (cookie
        tc_portal, from POST /portal/session); 401 without one.
      parameters:
      - name: key
        in: path
        required: true
        description: issue key (e.g. WEB-12; former keys keep working) or issue id
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalRequestDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - portalSession: []
  /portal/requests/{key}/comments:
    post:
      tags:
      - Service desk portal
      summary: Answer a request (text and files)
      operationId: replyToPortalRequest
      description: 'A comment by the requester, like an answer by e-mail: watchers are told, the service-level clock keeps
        running. Up to 5 files per message, 20 MB together (or TASKCRAFT_MAX_UPLOAD_MB if smaller; 413), text up to 20,000
        characters, 30 messages per hour (429). Not for requests of archived projects. Needs a portal session (cookie tc_portal,
        from POST /portal/session); 401 without one.'
      parameters:
      - name: key
        in: path
        required: true
        description: issue key (e.g. WEB-12; former keys keep working) or issue id
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: the message (plain text)
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: files (repeat the field)
        description: A message, files, or both.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: the comment's id
                required:
                - id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - portalSession: []
  /portal/requests/{key}/resolve:
    post:
      tags:
      - Service desk portal
      summary: Mark a request resolved
      operationId: resolvePortalRequest
      description: 'Where the project lets requesters (else 403): the request moves to the chosen done status (else the first
        one) in their name, with an optional last word as their comment. A resolved request answers `resolved` again. Needs
        a portal session (cookie tc_portal, from POST /portal/session); 401 without one.'
      parameters:
      - name: key
        in: path
        required: true
        description: issue key (e.g. WEB-12; former keys keep working) or issue id
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: a last word (up to 20,000 characters)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum:
                    - open
                    - in_progress
                    - resolved
                    description: the status in plain words
                required:
                - state
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - portalSession: []
  /portal/requests/{key}/approval:
    post:
      tags:
      - Service desk portal
      summary: Approve or reject, as the requester
      operationId: decidePortalApproval
      description: Where a status asks the requester (the request's `approval` says so; else 404). Needs a portal session
        (cookie tc_portal, from POST /portal/session); 401 without one.
      parameters:
      - name: key
        in: path
        required: true
        description: issue key (e.g. WEB-12; former keys keep working) or issue id
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                  - approve
                  - reject
                comment:
                  type: string
              required:
              - decision
      responses:
        '204':
          description: Done (no content)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - portalSession: []
  /portal/attachments/{id}:
    get:
      tags:
      - Service desk portal
      summary: Download one of the requester's own files
      operationId: downloadPortalAttachment
      description: Images, PDFs, videos and plain text inline, everything else as a download. Needs a portal session (cookie
        tc_portal, from POST /portal/session); 401 without one.
      parameters:
      - name: id
        in: path
        required: true
        description: file id
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - portalSession: []
  /portal/forms/{path}:
    get:
      tags:
      - Service desk portal
      summary: A public request form
      operationId: getRequestForm
      description: Published forms of projects that aren't archived; 404 for others. Carries a signed `stamp` to send back.
      parameters:
      - name: path
        in: path
        required: true
        description: the form's slug, or the project key (also a former one)
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestForm'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - {}
    post:
      tags:
      - Service desk portal
      summary: Send a request form
      operationId: submitRequestForm
      description: Opens an issue with the sender as its requester, who gets an acknowledgement with a link to the request
        in the portal. Requesters signed in to the portal send it under their own address and learn the new key (`request`);
        for others it is null. Kept free of spam by the hidden `website` field, a minimum fill time of 3 seconds (the stamp,
        valid for a day), 20 requests per IP address and 5 per e-mail address and hour (429) and size limits.
      parameters:
      - name: path
        in: path
        required: true
        description: the form's slug, or the project key (also a former one)
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestSubmission'
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request:
                    type:
                    - string
                    - 'null'
                    description: the new request's key (only for requesters signed in to the portal)
                required:
                - ok
                - request
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
      security:
      - {}
      - portalSession: []
  /portal/forms/{path}/suggest:
    get:
      tags:
      - Service desk portal
      summary: Articles that might answer a request
      operationId: suggestArticles
      description: Up to five pages of the form's WikiCraft space (`suggestSpace`) matching `q`, read with the installation's
        WikiCraft token; an empty list when the form suggests nothing, `q` is shorter than 3 characters, WikiCraft doesn't
        answer, or an address asks more than 60 times a minute.
      parameters:
      - name: path
        in: path
        required: true
        description: the form's slug, or the project key (also a former one)
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: what the requester typed so far
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    url:
                      type: string
                      format: uri
                    excerpt:
                      type:
                      - string
                      - 'null'
                      description: the matching text
                  required:
                  - title
                  - url
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - {}
  /projects/{key}/portal:
