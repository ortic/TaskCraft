[package]
name = "taskcraft-runner"
description = "The runner of TaskCraft's AI coding agents: claims runs, works on a checkout, hands the result back"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.11"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
tar = "0.4.44"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }

[lints]
workspace = true
