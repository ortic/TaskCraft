name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskcraft
          POSTGRES_PASSWORD: taskcraft
          POSTGRES_DB: taskcraft
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U taskcraft" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate the Kubernetes manifests
        run: |
          cp deploy/kubernetes/secret.example.yaml deploy/kubernetes/secret.yaml
          kubectl kustomize deploy/kubernetes > "$RUNNER_TEMP/k8s.yaml"
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -kubernetes-version 1.33.0 - < "$RUNNER_TEMP/k8s.yaml"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskcraft
          POSTGRES_PASSWORD: taskcraft
          POSTGRES_DB: taskcraft
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U taskcraft" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TASKCRAFT_E2E_ADMIN_URL: postgres://taskcraft:taskcraft@127.0.0.1:55433/postgres
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y postgresql-client
      - run: cd web && npm ci && npm run build
      - run: cargo build -p taskcraft
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - run: cd e2e && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
